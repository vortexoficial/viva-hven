<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Criar conta | Viva Haven</title>
    <meta name="theme-color" content="#0b1120" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;900&display=swap"
      rel="stylesheet"
    />

    <link rel="icon" href="assets/logo.svg" type="image/svg+xml" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="apple-touch-icon" href="/icons/icon-192.png" />
    <link rel="icon" type="image/png" sizes="192x192" href="/icons/icon-192.png" />
    <link rel="icon" type="image/png" sizes="512x512" href="/icons/icon-512.png" />

    <link rel="stylesheet" href="css/styles.css" />
    <script src="js/icons-sprite.js" defer></script>

    <style>
      body {
        min-height: 100vh;
        display: grid;
        place-items: center;
        padding: 24px;
      }

      .regCard {
        width: 100%;
        max-width: 460px;
      }

      .regHeader {
        text-align: center;
        margin-bottom: 22px;
      }

      .regLogo {
        width: 48px;
        height: 48px;
        margin: 0 auto 12px;
        display: block;
      }

      .regTitle {
        font-size: 22px;
        font-weight: 900;
        letter-spacing: -0.5px;
        margin: 0 0 6px;
        color: var(--text);
      }

      .regSubtitle {
        margin: 0;
        color: var(--muted);
        font-size: 14px;
      }

      .formGroup {
        margin-bottom: 16px;
      }

      .inputLabel {
        display: block;
        font-size: 13px;
        font-weight: 600;
        color: var(--muted);
        margin-bottom: 8px;
      }

      .inputField {
        width: 100%;
        padding: 12px 16px;
        background: var(--surface);
        border: 1px solid var(--border);
        border-radius: 12px;
        color: var(--text);
        font-family: inherit;
        font-size: 15px;
      }

      .submitBtn {
        width: 100%;
        padding: 12px 16px;
        border-radius: 12px;
        border: none;
        cursor: pointer;
        background: var(--brand);
        color: white;
        font-weight: 900;
        font-size: 15px;
      }

      .links {
        display: flex;
        justify-content: center;
        margin-top: 14px;
        gap: 10px;
        flex-wrap: wrap;
      }

      .link {
        color: var(--muted);
        text-decoration: none;
        font-weight: 800;
        font-size: 13px;
      }

      .link:hover {
        color: var(--text);
      }

      .note {
        margin-top: 10px;
        color: var(--faint);
        font-size: 12px;
        text-align: center;
      }
    </style>

    <script>
      (function () {
        try {
          var saved = localStorage.getItem('condoflow-theme');
          if (!saved || saved === 'dark') document.documentElement.setAttribute('data-theme', 'dark');
          else document.documentElement.removeAttribute('data-theme');
        } catch (e) {}
      })();
    </script>
  </head>

  <body>
    <div class="regCard card" style="padding: 22px;">
      <div class="regHeader">
        <img src="assets/logo.svg" alt="Viva Haven" class="regLogo" />
        <h1 class="regTitle">Criar conta</h1>
        <p class="regSubtitle">Cadastre-se para acessar a plataforma.</p>
      </div>

      <form id="registerForm">
        <div class="formGroup">
          <label class="inputLabel" for="name">Nome</label>
          <input class="inputField" id="name" type="text" placeholder="Seu nome" autocomplete="name" />
        </div>

        <div class="formGroup">
          <label class="inputLabel" for="email">E-mail</label>
          <input class="inputField" id="email" type="email" placeholder="seuemail@dominio.com" autocomplete="email" />
        </div>

        <div class="formGroup">
          <label class="inputLabel" for="cpf">CPF (opcional)</label>
          <input class="inputField" id="cpf" type="text" placeholder="000.000.000-00" inputmode="numeric" />
        </div>

        <div class="formGroup">
          <label class="inputLabel" for="password">Senha</label>
          <input class="inputField" id="password" type="password" placeholder="••••••••" autocomplete="new-password" />
        </div>

        <div class="formGroup">
          <label class="inputLabel" for="role">Perfil</label>
          <select class="inputField" id="role" disabled>
            <option value="MORADOR" selected>MORADOR</option>
          </select>
        </div>

        <button class="submitBtn" type="submit">Criar conta</button>

        <div class="links">
          <a class="link" href="/login.html">Já tenho conta</a>
        </div>

        <div class="note">Obs: é necessário configurar o Firebase antes (ver docs/FIREBASE_SETUP.md).</div>
      </form>
    </div>

    <script type="module">
      import { registerUser } from '/js/auth.js';

      const form = document.getElementById('registerForm');
      const btn = form ? form.querySelector('button[type="submit"]') : null;

      function value(id) {
        const el = document.getElementById(id);
        return el ? String(el.value || '').trim() : '';
      }

      async function onSubmit(event) {
        event.preventDefault();
        if (!form) return;

        const payload = {
          name: value('name'),
          email: value('email'),
          cpf: value('cpf'),
          password: value('password'),
          role: 'MORADOR',
        };

        try {
          if (btn) {
            btn.disabled = true;
            btn.textContent = 'Criando...';
          }

          const { profile } = await registerUser(payload);
          const role = String(profile.role || '').toUpperCase();

          if (role === 'MORADOR') window.location.href = '/app/home.html';
          else window.location.href = '/admin/dashboard.html';
        } catch (e) {
          alert(e && e.message ? e.message : 'Falha ao cadastrar.');
        } finally {
          if (btn) {
            btn.disabled = false;
            btn.textContent = 'Criar conta';
          }
        }
      }

      if (form) form.addEventListener('submit', onSubmit);
    </script>

    <script>
      (function () {
        try {
          if (!('serviceWorker' in navigator)) return;
          window.addEventListener('load', function () {
            navigator.serviceWorker.register('/sw.js').catch(function () {});
          });
        } catch (e) {}
      })();
    </script>
    <script src="js/a2hs.js" defer></script>
  </body>
</html>
