<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Morador • Reservas</title>
  <link rel="manifest" href="/manifest.webmanifest" />
  <link rel="stylesheet" href="/css/styles.css" />
  <script type="module" src="/js/core-init.js"></script>
</head>
<body>
  <header class="topbar">
    <div class="topbar__left">
      <a class="btn" href="/perfil.html">← Voltar</a>
      <h1 class="h1">Reservas</h1>
    </div>
    <div class="topbar__right">
      <span data-vh-context-anchor="1"></span>
      <span id="userBadge" class="badge"></span>
      <button id="logoutBtn" class="btn btn--ghost">Sair</button>
    </div>
  </header>

  <main class="container">
    <section class="card">
      <h2 class="h2">Nova reserva</h2>
      <form id="reservationForm" class="grid grid--3">
        <div class="field" style="grid-column: 1 / -1; display:flex; gap:10px; align-items:flex-end; justify-content:space-between; flex-wrap:wrap;">
          <div style="min-width:220px;">
            <div style="font-weight:700;font-size:12px;">Condomínio ativo</div>
            <div id="ctxCondoName" class="muted" style="margin-top:6px;">—</div>
          </div>
          <button id="pickCtxBtn" class="btn btn--ghost" type="button">Trocar</button>
        </div>
        <label class="field">
          <span>Área *</span>
          <select id="areaId" class="input" required>
            <option value="">Carregando…</option>
          </select>
        </label>
        <label class="field">
          <span>Título *</span>
          <input id="title" class="input" required placeholder="Ex.: Aniversário" />
        </label>
        <label class="field">
          <span>Início *</span>
          <input id="startAt" type="datetime-local" class="input" required />
        </label>
        <label class="field">
          <span>Fim *</span>
          <input id="endAt" type="datetime-local" class="input" required />
        </label>
        <label class="field" style="grid-column:1/-1;">
          <span>Observação</span>
          <textarea id="note" class="input" rows="3"></textarea>
        </label>
        <div class="field" style="grid-column: 1 / -1; display:flex; gap:8px; align-items:center;">
          <button class="btn" type="submit">Enviar</button>
          <span id="msg" class="muted"></span>
        </div>
      </form>
    </section>

    <section class="card">
      <h2 class="h2">Regras e disponibilidade</h2>
      <div class="grid grid--3">
        <div class="field" style="grid-column:1/-1;">
          <span>Regras da área</span>
          <div id="areaRules" class="muted" style="margin-top:6px;">Selecione uma área.</div>
        </div>
        <label class="field">
          <span>Dia</span>
          <input id="availDay" type="date" class="input" />
        </label>
        <div class="field" style="display:flex; gap:8px; align-items:flex-end;">
          <button id="availBtn" class="btn btn--ghost" type="button">Ver disponibilidade</button>
          <span id="availMsg" class="muted"></span>
        </div>
        <div class="field" style="grid-column:1/-1;">
          <div id="availList" class="list"></div>
        </div>
      </div>
    </section>

    <section class="card">
      <h2 class="h2">Minhas reservas</h2>
      <div class="row" style="display:flex; gap:8px; align-items:center; margin-bottom:12px;">
        <button id="refreshBtn" class="btn btn--ghost">Atualizar</button>
        <span id="listMsg" class="muted"></span>
      </div>
      <div id="list" class="list"></div>
    </section>
  </main>

  <script type="module">
    import { protect } from '/js/route-guard.js';
    import { initFirebase } from '/js/firebase-init.js';
    import { watchAuthAndContext, getActiveContext, openSelector } from '/js/active-context.js';

    import {
      createReservation,
      listReservations,
      listCommonAreas,
      listReservationCalendar,
      cancelReservationAsResident,
    } from '/js/modules/residents.js';

    await protect(['/app/']);

    const $ = (id) => document.getElementById(id);

    const state = {
      condoId: null,
      condos: [],
      user: null,
      areas: [],
      areaById: new Map(),
    };

    function setMsg(el, msg, isErr) {
      el.textContent = msg || '';
      el.classList.toggle('error', !!isErr);
    }

    function formatTs(ts) {
      if (!ts) return '';
      try {
        if (typeof ts.toDate === 'function') return ts.toDate().toLocaleString('pt-BR');
        return new Date(ts).toLocaleString('pt-BR');
      } catch (e) {
        return '';
      }
    }

    function asItemRow(title, subtitle, right) {
      return `
        <div class="list__item">
          <div class="list__main">
            <div class="list__title">${title}</div>
            <div class="list__sub">${subtitle || ''}</div>
          </div>
          <div class="list__meta">${right || ''}</div>
        </div>
      `;
    }

    function setAreasSelect(areas) {
      const sel = $('areaId');
      if (!sel) return;
      const items = Array.isArray(areas) ? areas : [];
      if (!items.length) {
        sel.innerHTML = '<option value="">(nenhuma área cadastrada)</option>';
        sel.value = '';
        return;
      }
      sel.innerHTML = '<option value="">Selecione…</option>' + items.map((a) => `<option value="${a.id}">${a.name || a.id}</option>`).join('');
    }

    function renderAreaRules(area) {
      const el = $('areaRules');
      if (!el) return;
      if (!area) {
        el.textContent = 'Selecione uma área.';
        return;
      }

      const bits = [];
      if (area.openHour != null && area.closeHour != null) bits.push(`Horário: ${area.openHour}h → ${area.closeHour}h`);
      if (area.capacity != null) bits.push(`Capacidade: ${area.capacity}`);
      if (area.feeCents != null) bits.push(`Taxa: ${(Number(area.feeCents || 0) / 100).toLocaleString('pt-BR', { style: 'currency', currency: 'BRL' })}`);
      bits.push(`Aprovação: ${area.requiresApproval ? 'necessária' : 'automática'}`);
      if (area.cancelHoursBefore != null && Number(area.cancelHoursBefore) > 0) bits.push(`Cancelamento: até ${area.cancelHoursBefore}h antes`);

      el.textContent = bits.length ? bits.join(' • ') : 'Sem regras específicas.';
    }

    function formatTime(ts) {
      if (!ts) return '';
      try {
        const d = typeof ts.toDate === 'function' ? ts.toDate() : (ts instanceof Date ? ts : new Date(ts));
        return d.toLocaleTimeString('pt-BR', { hour: '2-digit', minute: '2-digit' });
      } catch (e) {
        return '';
      }
    }

    async function renderAvailability() {
      if (!state.condoId) {
        $('availList').innerHTML = '<p class="muted">Selecione um condomínio.</p>';
        setMsg($('availMsg'), 'Sem condomínio ativo.', true);
        return;
      }
      const areaId = String($('areaId').value || '').trim();
      const day = $('availDay').value;
      if (!areaId) {
        setMsg($('availMsg'), 'Selecione uma área.', true);
        return;
      }
      if (!day) {
        setMsg($('availMsg'), 'Selecione um dia.', true);
        return;
      }

      setMsg($('availMsg'), 'Carregando...');
      try {
        const slots = await listReservationCalendar(state.condoId, { areaId, day });
        $('availList').innerHTML = slots.length
          ? slots.map((s) => {
              const st = formatTime(s.startAt);
              const en = formatTime(s.endAt);
              const right = `<span class="badge">${s.status || 'solicitado'}</span>`;
              return asItemRow(s.title || 'Reserva', `${st} → ${en}`, right);
            }).join('')
          : '<p class="muted">Sem reservas neste dia.</p>';
        setMsg($('availMsg'), `Total: ${slots.length}`);
      } catch (err) {
        setMsg($('availMsg'), err.message || String(err), true);
      }
    }

    function setActiveCondoName(text) {
      const el = $('ctxCondoName');
      if (!el) return;
      el.textContent = text ? String(text) : '—';
    }

    async function renderList() {
      if (!state.condoId) {
        $('list').innerHTML = '<p class="muted">Selecione um condomínio para ver suas reservas.</p>';
        setMsg($('listMsg'), 'Sem condomínio ativo.', true);
        return;
      }
      setMsg($('listMsg'), 'Carregando...');
      try {
        const items = await listReservations(state.condoId, { mineOnly: true });
        $('list').innerHTML = items.length
          ? items.map((r) => {
              const start = formatTs(r.startAt);
              const end = formatTs(r.endAt);
              const status = r.status || 'solicitado';
              const canCancel = status === 'solicitado' || status === 'aprovado';
              const right = `
                <div style="display:grid;gap:8px;justify-items:end;">
                  <div>Status: <span class="badge">${status}</span></div>
                  ${canCancel ? `<button class="btn btn--ghost" type="button" data-cancel="${r.id}">Cancelar</button>` : ''}
                </div>
              `;
              return asItemRow(
                r.title,
                `Área: ${r.area} • ${start} → ${end}${r.decisionNote ? ` • Obs: ${r.decisionNote}` : ''}`,
                right
              );
            }).join('')
          : '<p class="muted">Nenhuma reserva encontrada.</p>';
        setMsg($('listMsg'), `Total: ${items.length}`);

        $('list').querySelectorAll('button[data-cancel]').forEach((btn) => {
          btn.addEventListener('click', async () => {
            const id = btn.getAttribute('data-cancel');
            if (!id) return;
            btn.disabled = true;
            setMsg($('listMsg'), 'Cancelando...');
            try {
              await cancelReservationAsResident(state.condoId, id);
              await renderList();
              setMsg($('listMsg'), 'Reserva cancelada.');
              try { await renderAvailability(); } catch (e) {}
            } catch (e) {
              setMsg($('listMsg'), e && e.message ? e.message : String(e), true);
            } finally {
              btn.disabled = false;
            }
          });
        });
      } catch (err) {
        setMsg($('listMsg'), err.message || String(err), true);
      }
    }

    async function refreshAreas() {
      state.areas = [];
      state.areaById = new Map();
      if (!state.condoId) {
        setAreasSelect([]);
        renderAreaRules(null);
        return;
      }
      try {
        const items = await listCommonAreas(state.condoId);
        state.areas = items;
        state.areaById = new Map(items.map((a) => [String(a.id), a]));
        setAreasSelect(items);
        const cur = String($('areaId').value || '').trim();
        renderAreaRules(state.areaById.get(cur) || null);
      } catch (e) {
        setAreasSelect([]);
        renderAreaRules(null);
      }
    }

    async function bootstrap() {
      const { auth, db } = await initFirebase();

      $('logoutBtn').addEventListener('click', async () => {
        await auth.signOut();
        location.href = '/login.html';
      });

      $('refreshBtn').addEventListener('click', renderList);

      $('availBtn').addEventListener('click', renderAvailability);

      $('areaId').addEventListener('change', async () => {
        const cur = String($('areaId').value || '').trim();
        renderAreaRules(state.areaById.get(cur) || null);
        $('availList').innerHTML = '';
        setMsg($('availMsg'), '');
      });

      const pickBtn = $('pickCtxBtn');
      if (pickBtn) pickBtn.addEventListener('click', () => openSelector());

      $('reservationForm').addEventListener('submit', async (e) => {
        e.preventDefault();
        setMsg($('msg'), 'Enviando...');
        try {
          if (!state.condoId) {
            setMsg($('msg'), 'Selecione um condomínio antes de reservar.', true);
            try { openSelector(); } catch (e) {}
            return;
          }
          await createReservation(state.condoId, {
            areaId: $('areaId').value,
            title: $('title').value,
            note: $('note').value,
            startAt: $('startAt').value,
            endAt: $('endAt').value,
          });
          e.target.reset();
          setMsg($('msg'), 'Reserva enviada (aguardando aprovação).');
          await renderList();
          try { await renderAvailability(); } catch (e) {}
        } catch (err) {
          setMsg($('msg'), err.message || String(err), true);
        }
      });

      watchAuthAndContext((ev) => {
        const user = ev && ev.user ? ev.user : null;
        state.user = user;
        if (user) $('userBadge').textContent = user.email || user.uid;

        const ctx = ev && ev.context ? ev.context : getActiveContext();
        state.condoId = ctx && ctx.condoId ? String(ctx.condoId) : null;

        try {
          const condos = ev && Array.isArray(ev.condos) ? ev.condos : [];
          const picked = condos.find((c) => c && c.id === state.condoId);
          setActiveCondoName(picked && picked.name ? picked.name : (state.condoId || '—'));
        } catch (e) {
          setActiveCondoName(state.condoId || '—');
        }

        refreshAreas().catch(() => {});
        // default de disponibilidade: hoje
        try {
          if ($('availDay') && !$('availDay').value) {
            const d = new Date();
            const yyyy = d.getFullYear();
            const mm = String(d.getMonth() + 1).padStart(2, '0');
            const dd = String(d.getDate()).padStart(2, '0');
            $('availDay').value = `${yyyy}-${mm}-${dd}`;
          }
        } catch (e) {}

        renderList().catch(() => {});
      });

      const initial = getActiveContext();
      state.condoId = initial.condoId || null;
      setActiveCondoName(state.condoId || '—');
      try {
        if ($('availDay') && !$('availDay').value) {
          const d = new Date();
          const yyyy = d.getFullYear();
          const mm = String(d.getMonth() + 1).padStart(2, '0');
          const dd = String(d.getDate()).padStart(2, '0');
          $('availDay').value = `${yyyy}-${mm}-${dd}`;
        }
      } catch (e) {}
      await refreshAreas();
      await renderList();
    }

    bootstrap();
  </script>
</body>
</html>
