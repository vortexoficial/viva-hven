<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#0b1120" />
    <title>Boletos | Viva Haven</title>

    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="apple-touch-icon" href="/icons/icon-192.png" />
    <link rel="icon" type="image/png" sizes="192x192" href="/icons/icon-192.png" />
    <link rel="icon" type="image/png" sizes="512x512" href="/icons/icon-512.png" />
    <link rel="stylesheet" href="/css/styles.css" />
    <script type="module" src="/js/core-init.js"></script>

    <script>
      (function () {
        try {
          var saved = localStorage.getItem('condoflow-theme');
          if (saved === 'dark') document.documentElement.setAttribute('data-theme', 'dark');
        } catch (e) {}
      })();
    </script>
  </head>

  <body>
    <main class="container" style="padding-top: 28px; padding-bottom: 72px;">
      <div style="display:flex;align-items:center;gap:12px;justify-content:space-between;flex-wrap:wrap;">
        <div>
          <h1 class="section__title" style="margin-bottom: 6px;">Boletos</h1>
          <p class="section__subtitle" style="margin-left:0;margin-right:0;max-width:900px;">
            Veja suas cobranças e baixe comprovantes (quando disponíveis).
          </p>
        </div>

        <div style="display:flex;gap:10px;align-items:center;flex-wrap:wrap;">
          <span data-vh-context-anchor="1"></span>
          <a class="btn btn--ghost" href="/perfil.html">Voltar</a>
          <button id="logoutBtn" class="btn btn--ghost" type="button">Sair</button>
        </div>
      </div>

      <section class="card" style="margin-top: 14px;">
        <div style="display:flex;gap:12px;align-items:flex-end;flex-wrap:wrap;">
          <div style="flex:1;min-width:240px;">
            <label style="display:block;font-weight:700;font-size:12px;margin-bottom:6px;">Condomínio</label>
            <div id="ctxCondoName" class="input" style="width:100%;display:flex;align-items:center;min-height:42px;">—</div>
          </div>
          <div>
            <button id="pickCtxBtn" class="btn btn--ghost" type="button">Trocar</button>
            <button id="refreshBtn" class="btn" type="button">Atualizar</button>
          </div>
        </div>
      </section>

      <div id="status" style="margin-top: 10px; font-size: 12px; color: var(--muted);"></div>

      <section style="margin-top: 14px; display:grid; gap:14px; grid-template-columns: 1fr;">
        <article class="card">
          <h2 class="card__title" style="margin-bottom: 10px;">Cobranças</h2>
          <div id="chargeList" style="display:grid;gap:10px;"></div>
        </article>

        <article class="card">
          <h2 class="card__title" style="margin-bottom: 10px;">Detalhe</h2>
          <input type="hidden" id="chargeId" />
          <div id="detail" style="font-size:12px;color:var(--muted);"></div>
          <div id="receipt" style="margin-top:10px;"></div>
        </article>
      </section>
    </main>

    <script src="/js/a2hs.js" defer></script>

    <script type="module">
      import { protect } from '/js/route-guard.js';
      import { logoutUser } from '/js/auth.js';
      import { watchAuthAndContext, getActiveContext, openSelector } from '/js/active-context.js';
      import { listMyCharges, getPayment, Money } from '/js/modules/finance.js';

      await protect(['/app/']);

      const $ = (id) => document.getElementById(id);
      const statusEl = $('status');
      const ctxCondoName = $('ctxCondoName');

      const state = {
        condoId: '',
      };

      function setStatus(msg) {
        statusEl.textContent = msg ? String(msg) : '';
      }

      async function withBusy(btn, fn) {
        if (btn) btn.disabled = true;
        try {
          return await fn();
        } catch (e) {
          setStatus(e && e.message ? e.message : 'Erro');
          throw e;
        } finally {
          if (btn) btn.disabled = false;
        }
      }

      function currentCondoId() {
        return state.condoId ? String(state.condoId) : '';
      }

      function fmtDateMaybe(v) {
        try {
          if (!v) return '';
          if (typeof v.toDate === 'function') {
            const d = v.toDate();
            const yyyy = d.getFullYear();
            const mm = String(d.getMonth() + 1).padStart(2, '0');
            const dd = String(d.getDate()).padStart(2, '0');
            return yyyy + '-' + mm + '-' + dd;
          }
          return '';
        } catch (e) {
          return '';
        }
      }

      function toDate(v) {
        try {
          if (!v) return null;
          if (typeof v.toDate === 'function') return v.toDate();
          if (v instanceof Date) return v;
          return null;
        } catch (e) {
          return null;
        }
      }

      function daysLate(dueAt) {
        const d = toDate(dueAt);
        if (!d) return 0;
        const now = new Date();
        const diff = now.getTime() - d.getTime();
        if (diff <= 0) return 0;
        return Math.floor(diff / (24 * 60 * 60 * 1000));
      }

      function computeLateBreakdown(amountCents, charge) {
        const base = Number(amountCents || 0);
        const dl = daysLate(charge && charge.dueAt ? charge.dueAt : null);
        if (!dl) return { daysLate: 0, fineCents: 0, interestCents: 0, totalCents: base };

        const finePercent = charge && charge.finePercent != null ? Number(charge.finePercent) : 0;
        const interestMonthly = charge && charge.interestMonthlyPercent != null ? Number(charge.interestMonthlyPercent) : 0;

        const fineCents = finePercent > 0 ? Math.round((base * finePercent) / 100) : 0;
        const interestDaily = interestMonthly > 0 ? (interestMonthly / 100) / 30 : 0;
        const interestCents = interestDaily > 0 ? Math.round(base * interestDaily * dl) : 0;

        const totalCents = Math.max(0, base + fineCents + interestCents);
        return { daysLate: dl, fineCents, interestCents, totalCents };
      }

      function setActiveCondoName(text) {
        if (!ctxCondoName) return;
        ctxCondoName.textContent = text ? String(text) : '—';
      }

      function renderNoContext(container) {
        if (!container) return;
        container.innerHTML =
          '<div class="card" style="padding:12px;">' +
          '  <div style="font-weight:900;">Selecione um condomínio</div>' +
          '  <div style="margin-top:6px;font-size:12px;color:var(--muted);">O app usa o contexto ativo para listar boletos.</div>' +
          '  <div style="display:flex;gap:10px;flex-wrap:wrap;margin-top:12px;">' +
          '    <button id="pickCtxInline" class="btn" type="button">Escolher condomínio</button>' +
          '  </div>' +
          '</div>';

        const btn = container.querySelector('#pickCtxInline');
        if (btn) btn.addEventListener('click', () => openSelector());
      }

      function renderNoUnit(container, msg) {
        if (!container) return;
        container.innerHTML =
          '<div class="card" style="padding:12px;">' +
          '  <div style="font-weight:900;">Cobranças indisponíveis</div>' +
          '  <div style="margin-top:6px;font-size:12px;color:var(--muted);">' +
          (msg ? String(msg) : 'Sua unidade não está vinculada ao seu acesso.') +
          '  </div>' +
          '  <div style="display:flex;gap:10px;flex-wrap:wrap;margin-top:12px;">' +
          '    <button id="pickCtxInline" class="btn btn--ghost" type="button">Trocar condomínio</button>' +
          '  </div>' +
          '</div>';

        const btn = container.querySelector('#pickCtxInline');
        if (btn) btn.addEventListener('click', () => openSelector());
      }

      function renderList(container, items, onPick) {
        container.innerHTML = '';
        if (!items || items.length === 0) {
          container.innerHTML = '<p style="margin:0;color:var(--muted);font-size:12px;">Nenhuma cobrança.</p>';
          return;
        }

        items.forEach((it) => {
          const row = document.createElement('div');
          row.className = 'card';
          row.style.padding = '12px';

          const head = document.createElement('div');
          head.style.display = 'flex';
          head.style.alignItems = 'center';
          head.style.justifyContent = 'space-between';
          head.style.gap = '10px';

          const left = document.createElement('div');
          const title = (it.referenceMonth ? ('Ref. ' + it.referenceMonth) : 'Cobrança') + (it.description ? (' — ' + it.description) : '');
          const due = it.dueAt ? fmtDateMaybe(it.dueAt) : '';
          const subtitle = [due ? ('venc: ' + due) : null, it.status ? ('status: ' + it.status) : null]
            .filter(Boolean)
            .join(' • ');

          left.innerHTML =
            '<div style="font-weight:800;">' + title + '</div>' +
            '<div style="font-size:12px;color:var(--muted);">' + subtitle + '</div>' +
            '<div style="margin-top:6px;font-size:12px;color:var(--text-2);">' + Money.centsToBr(it.amountCents) + '</div>';

          const pickBtn = document.createElement('button');
          pickBtn.type = 'button';
          pickBtn.className = 'btn btn--ghost';
          pickBtn.textContent = 'Abrir';
          pickBtn.addEventListener('click', () => onPick(it));

          head.appendChild(left);
          head.appendChild(pickBtn);
          row.appendChild(head);
          container.appendChild(row);
        });
      }

      async function refreshCharges() {
        const cId = currentCondoId();
        const listEl = $('chargeList');
        $('chargeId').value = '';
        $('detail').textContent = '';
        $('receipt').innerHTML = '';

        if (!cId) {
          renderNoContext(listEl);
          setStatus('Selecione um condomínio para ver suas cobranças.');
          return;
        }

        let items = [];
        try {
          items = await listMyCharges(cId);
        } catch (e) {
          // Caso o morador não tenha unitId no membership
          renderNoUnit(listEl, e && e.message ? e.message : 'Não foi possível listar cobranças.');
          setStatus(e && e.message ? e.message : 'Não foi possível listar cobranças.');
          return;
        }

        renderList(listEl, items, async (it) => {
          $('chargeId').value = it.id;

          const due = it.dueAt ? fmtDateMaybe(it.dueAt) : '';
          const paid = it.paidAt && typeof it.paidAt.toDate === 'function' ? fmtDateMaybe(it.paidAt) : '';

          const late = computeLateBreakdown(it.amountCents, it);
          const showLate = (it.status !== 'pago') && late.daysLate > 0;

          $('detail').innerHTML =
            '<div><strong>Valor:</strong> ' + Money.centsToBr(it.amountCents) + '</div>' +
            (due ? '<div><strong>Vencimento:</strong> ' + due + '</div>' : '') +
            (it.status ? '<div><strong>Status:</strong> ' + it.status + '</div>' : '') +
            (paid ? '<div><strong>Pago em:</strong> ' + paid + '</div>' : '') +
            (showLate
              ? (
                  '<div style="margin-top:8px;">' +
                  '<div><strong>Atraso:</strong> ' + late.daysLate + ' dia(s)</div>' +
                  (late.fineCents ? '<div><strong>Multa:</strong> ' + Money.centsToBr(late.fineCents) + '</div>' : '') +
                  (late.interestCents ? '<div><strong>Juros:</strong> ' + Money.centsToBr(late.interestCents) + '</div>' : '') +
                  '<div><strong>Total estimado:</strong> ' + Money.centsToBr(late.totalCents) + '</div>' +
                  '</div>'
                )
              : '');

          const links = [];
          const boletoUrl = it.boletoUrl ? String(it.boletoUrl) : '';
          const paymentUrl = it.paymentUrl ? String(it.paymentUrl) : '';
          const receiptUrl = it.paymentReceiptUrl ? String(it.paymentReceiptUrl) : '';
          const pix = it.pixCopyPaste ? String(it.pixCopyPaste) : '';

          if (boletoUrl) links.push('<a class="btn" target="_blank" href="' + boletoUrl + '">Abrir boleto</a>');
          if (paymentUrl) links.push('<a class="btn btn--ghost" target="_blank" href="' + paymentUrl + '">Pagar online</a>');
          if (receiptUrl) links.push('<a class="btn btn--ghost" target="_blank" href="' + receiptUrl + '">Comprovante</a>');

          // Compat: tenta buscar comprovante pelo paymentId (pode falhar por regra)
          if (!receiptUrl && it.paymentId) {
            try {
              const payment = await getPayment(cId, it.paymentId);
              const url = payment && payment.receipt && payment.receipt.url ? payment.receipt.url : '';
              if (url) links.push('<a class="btn btn--ghost" target="_blank" href="' + url + '">Comprovante</a>');
            } catch (e) {}
          }

          $('receipt').innerHTML =
            (links.length ? ('<div style="display:flex;gap:10px;flex-wrap:wrap;">' + links.join('') + '</div>') : '') +
            (pix
              ? (
                  '<div style="margin-top:10px;">' +
                  '<div style="font-weight:800;margin-bottom:6px;">PIX (copia e cola)</div>' +
                  '<textarea class="input" rows="3" readonly>' + pix + '</textarea>' +
                  '</div>'
                )
              : (links.length ? '' : '<p style="margin:0;font-size:12px;color:var(--muted);">Sem links de pagamento disponíveis.</p>'));

          setStatus('Cobrança selecionada.');
        });
      }

      const logoutBtn = $('logoutBtn');
      logoutBtn.addEventListener('click', async () => {
        await withBusy(logoutBtn, async () => {
          await logoutUser();
          window.location.href = '/login.html';
        });
      });

      $('refreshBtn').addEventListener('click', async () => {
        await withBusy($('refreshBtn'), async () => {
          await refreshCharges();
          setStatus('Atualizado.');
        });
      });

      const pickBtn = $('pickCtxBtn');
      if (pickBtn) pickBtn.addEventListener('click', () => openSelector());

      watchAuthAndContext((ev) => {
        const ctx = ev && ev.context ? ev.context : getActiveContext();
        state.condoId = ctx && ctx.condoId ? String(ctx.condoId) : '';

        try {
          const condos = ev && Array.isArray(ev.condos) ? ev.condos : [];
          const picked = condos.find((c) => c && c.id === state.condoId);
          setActiveCondoName(picked && picked.name ? picked.name : (state.condoId || '—'));
        } catch (e) {
          setActiveCondoName(state.condoId || '—');
        }

        withBusy(null, refreshCharges).catch(() => {});
      });

      const initial = getActiveContext();
      state.condoId = initial.condoId || '';
      setActiveCondoName(state.condoId || '—');
      await withBusy(null, refreshCharges);
    </script>

    <script>
      (function () {
        try {
          if (!('serviceWorker' in navigator)) return;
          window.addEventListener('load', function () {
            navigator.serviceWorker.register('/sw.js').catch(function () {});
          });
        } catch (e) {}
      })();
    </script>
  </body>
</html>
