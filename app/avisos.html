<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Morador • Avisos</title>
  <link rel="manifest" href="/manifest.webmanifest" />
  <link rel="stylesheet" href="/css/styles.css" />
  <script type="module" src="/js/core-init.js"></script>
</head>
<body>
  <header class="topbar">
    <div class="topbar__left">
      <a class="btn" href="/perfil.html">← Voltar</a>
      <h1 class="h1">Avisos</h1>
    </div>
    <div class="topbar__right">
      <span data-vh-context-anchor="1"></span>
      <span id="userBadge" class="badge"></span>
      <button id="logoutBtn" class="btn btn--ghost">Sair</button>
    </div>
  </header>

  <main class="container">
    <section class="card">
      <h2 class="h2">Condomínio ativo</h2>
      <div class="grid grid--3">
        <div class="field" style="grid-column:1/-1;">
          <span>Condomínio</span>
          <div id="ctxCondoName" class="input" style="min-height:42px;display:flex;align-items:center;">—</div>
        </div>
        <div class="field" style="grid-column:1/-1;display:flex;gap:8px;align-items:center;flex-wrap:wrap;">
          <button id="pickCtxBtn" class="btn btn--ghost" type="button">Trocar</button>
          <button id="refreshBtn" class="btn btn--ghost" type="button">Atualizar</button>
          <span id="msg" class="muted"></span>
        </div>
      </div>
    </section>

    <section class="card">
      <h2 class="h2">Avisos do condomínio</h2>
      <div id="annList" class="list"></div>
    </section>

    <section class="card">
      <h2 class="h2">Enquetes</h2>
      <div id="pollList" class="list"></div>
    </section>
  </main>

  <script type="module">
    import { initFirebase } from '/js/firebase-init.js';
    import { protect } from '/js/route-guard.js';
    import { watchAuthAndContext, getActiveContext, openSelector } from '/js/active-context.js';
    import {
      listAnnouncements,
      listPolls,
      getMyVote,
      castVote,
      listPollVotes,
      listMyReadReceipts,
      confirmRead,
    } from '/js/modules/comms.js';

    await protect(['/app/']);

    // Notificações (MVP): ao abrir a tela de avisos, limpa o dot.
    try {
      localStorage.setItem('vh_unread_avisos', '0');
    } catch (e) {}

    const $ = (id) => document.getElementById(id);

    const state = {
      condoId: null,
      user: null,
      receipts: new Map(),
      votes: new Map(),
    };

    function setActiveCondoName(text) {
      const el = $('ctxCondoName');
      if (!el) return;
      el.textContent = text ? String(text) : '—';
    }

    function setMsg(msg, isErr) {
      const el = $('msg');
      if (!el) return;
      el.textContent = msg || '';
      el.classList.toggle('error', !!isErr);
    }

    function formatTs(ts) {
      if (!ts) return '';
      try {
        if (typeof ts.toDate === 'function') return ts.toDate().toLocaleString('pt-BR');
        return new Date(ts).toLocaleString('pt-BR');
      } catch (e) {
        return '';
      }
    }

    function asItemRow(title, subtitle, right) {
      return `
        <div class="list__item">
          <div class="list__main">
            <div class="list__title">${title}</div>
            <div class="list__sub">${subtitle || ''}</div>
          </div>
          <div class="list__meta">${right || ''}</div>
        </div>
      `;
    }

    function receiptKey(kind, targetId) {
      return `${kind}:${targetId}`;
    }

    // Contexto vem do active-context.js

    async function loadReceipts() {
      state.receipts.clear();
      const items = await listMyReadReceipts(state.condoId);
      (items || []).forEach((r) => {
        const kind = String(r.kind || '');
        const targetId = String(r.targetId || '');
        if (!kind || !targetId) return;
        state.receipts.set(receiptKey(kind, targetId), r);
      });
    }

    async function renderAnnouncements() {
      const root = $('annList');
      if (!root) return;

      const items = await listAnnouncements(state.condoId, { publishedOnly: true, channel: 'app' });
      if (!items.length) {
        root.innerHTML = '<p class="muted">Nenhum aviso publicado.</p>';
        return;
      }

      root.innerHTML = items
        .map((a) => {
          const read = state.receipts.has(receiptKey('announcement', a.id));
          const right = read
            ? '<span class="badge">Lido</span>'
            : `<button class="btn btn--ghost" type="button" data-read-ann="${a.id}">Marcar como lido</button>`;
          const subtitle = `${a.publishedAt ? formatTs(a.publishedAt) : ''} • ${String(a.body || '').slice(0, 160)}${String(a.body || '').length > 160 ? '…' : ''}`;
          return asItemRow(a.title || '(sem título)', subtitle, right);
        })
        .join('');

      root.querySelectorAll('button[data-read-ann]').forEach((btn) => {
        btn.addEventListener('click', async () => {
          const id = btn.getAttribute('data-read-ann');
          if (!id) return;
          btn.disabled = true;
          setMsg('Registrando leitura...');
          try {
            await confirmRead(state.condoId, 'announcement', id);
            await loadReceipts();
            await renderAnnouncements();
            setMsg('Leitura confirmada.');
          } catch (e) {
            setMsg(e && e.message ? e.message : String(e), true);
          } finally {
            btn.disabled = false;
          }
        });
      });
    }

    async function renderPolls() {
      const root = $('pollList');
      if (!root) return;

      const polls = await listPolls(state.condoId, {});
      if (!polls.length) {
        root.innerHTML = '<p class="muted">Nenhuma enquete.</p>';
        return;
      }

      // Carrega votos (somente get do próprio voto) de forma sequencial para manter simples.
      state.votes.clear();
      for (const p of polls) {
        try {
          const my = await getMyVote(state.condoId, p.id);
          if (my) state.votes.set(p.id, my);
        } catch (e) {}
      }

      root.innerHTML = polls
        .map((p) => {
          const status = String(p.status || 'aberta');
          const myVote = state.votes.get(p.id) || null;
          const options = Array.isArray(p.options) ? p.options : [];
          const right = `<span class="badge">${status}</span>`;

          let subtitle = p.description ? String(p.description) : '';
          if (p.closeAt) subtitle = (subtitle ? subtitle + ' • ' : '') + `Até ${formatTs(p.closeAt)}`;
          if (myVote) {
            subtitle = (subtitle ? subtitle + ' • ' : '') + `Seu voto: ${myVote.choiceLabel || myVote.choiceId || ''}`;
          }

          const voteControls = !myVote && status === 'aberta'
            ? `
              <div style="margin-top:8px;display:grid;gap:8px;">
                <select class="input" data-poll-choice="${p.id}">
                  <option value="">Selecione…</option>
                  ${options.map((o) => `<option value="${o.id}">${o.label}</option>`).join('')}
                </select>
                <button class="btn" type="button" data-poll-vote="${p.id}">Votar</button>
              </div>
            `
            : '';

          const canSeeResults = status !== 'aberta' || !!myVote;
          const resultsControls = canSeeResults
            ? `
              <div style="margin-top:8px;display:grid;gap:8px;">
                <button class="btn btn--ghost" type="button" data-poll-results="${p.id}">Ver resultados</button>
                <div class="muted" data-poll-results-box="${p.id}"></div>
              </div>
            `
            : '';

          return `
            <div class="list__item" style="align-items: flex-start;">
              <div class="list__main">
                <div class="list__title">${p.title || '(sem título)'}</div>
                <div class="list__sub">${subtitle || ''}${voteControls}${resultsControls}</div>
              </div>
              <div class="list__meta">${right}</div>
            </div>
          `;
        })
        .join('');

      root.querySelectorAll('button[data-poll-vote]').forEach((btn) => {
        btn.addEventListener('click', async () => {
          const pollId = btn.getAttribute('data-poll-vote');
          const select = root.querySelector(`select[data-poll-choice="${pollId}"]`);
          const choiceId = select ? String(select.value || '').trim() : '';
          if (!pollId) return;
          if (!choiceId) {
            setMsg('Selecione uma opção antes de votar.', true);
            return;
          }

          btn.disabled = true;
          setMsg('Enviando voto...');
          try {
            await castVote(state.condoId, pollId, choiceId);
            // Registra leitura da enquete automaticamente
            try { await confirmRead(state.condoId, 'poll', pollId); } catch (e) {}
            await loadReceipts();
            await renderPolls();
            setMsg('Voto registrado.');
          } catch (e) {
            setMsg(e && e.message ? e.message : String(e), true);
          } finally {
            btn.disabled = false;
          }
        });
      });

      root.querySelectorAll('button[data-poll-results]').forEach((btn) => {
        btn.addEventListener('click', async () => {
          const pollId = btn.getAttribute('data-poll-results');
          if (!pollId) return;
          const box = root.querySelector(`div[data-poll-results-box="${pollId}"]`);
          btn.disabled = true;
          setMsg('Carregando resultados...');
          try {
            const poll = polls.find((x) => x && x.id === pollId);
            if (!poll) throw new Error('Enquete não encontrada.');

            const votes = await listPollVotes(state.condoId, pollId);
            const options = Array.isArray(poll.options) ? poll.options : [];
            const counts = new Map();
            votes.forEach((v) => {
              const c = String(v.choiceId || '');
              if (!c) return;
              counts.set(c, (counts.get(c) || 0) + 1);
            });

            const total = votes.length;
            const lines = options.map((o) => {
              const id = String(o.id || '');
              const label = String(o.label || id);
              const n = counts.get(id) || 0;
              const pct = total ? Math.round((n / total) * 100) : 0;
              return `<div>${label}: <strong>${n}</strong> (${pct}%)</div>`;
            });

            if (box) {
              box.innerHTML = `<div style="margin-top:6px;">${lines.join('')}${options.length ? '' : '<div>(sem opções)</div>'}<div style="margin-top:6px;">Total: ${total}</div></div>`;
            }
            setMsg('Resultados carregados.');
          } catch (e) {
            if (box) box.textContent = e && e.message ? e.message : String(e);
            setMsg(e && e.message ? e.message : String(e), true);
          } finally {
            btn.disabled = false;
          }
        });
      });
    }

    async function refreshAll() {
      if (!state.condoId) {
        const rootA = $('annList');
        const rootP = $('pollList');
        if (rootA) rootA.innerHTML = '<p class="muted">Selecione um condomínio para ver avisos.</p>';
        if (rootP) rootP.innerHTML = '<p class="muted">Selecione um condomínio para ver enquetes.</p>';
        setMsg('Sem condomínio ativo.', true);
        return;
      }
      setMsg('Carregando...');
      try {
        await loadReceipts();
        await renderAnnouncements();
        await renderPolls();
        setMsg('OK');
      } catch (e) {
        setMsg(e && e.message ? e.message : String(e), true);
      }
    }

    async function bootstrap() {
      const { auth } = await initFirebase();

      $('logoutBtn').addEventListener('click', async () => {
        await auth.signOut();
        location.href = '/login.html';
      });

      $('refreshBtn').addEventListener('click', refreshAll);

      const pickBtn = $('pickCtxBtn');
      if (pickBtn) pickBtn.addEventListener('click', () => openSelector());

      watchAuthAndContext((ev) => {
        const user = ev && ev.user ? ev.user : null;
        state.user = user || null;
        if (user) $('userBadge').textContent = user.email || user.uid;

        const ctx = ev && ev.context ? ev.context : getActiveContext();
        state.condoId = ctx && ctx.condoId ? String(ctx.condoId) : null;

        try {
          const condos = ev && Array.isArray(ev.condos) ? ev.condos : [];
          const picked = condos.find((c) => c && c.id === state.condoId);
          setActiveCondoName(picked && picked.name ? picked.name : (state.condoId || '—'));
        } catch (e) {
          setActiveCondoName(state.condoId || '—');
        }

        refreshAll().catch(() => {});
      });

      const initial = getActiveContext();
      state.condoId = initial.condoId || null;
      setActiveCondoName(state.condoId || '—');
      await refreshAll();
    }

    bootstrap();
  </script>
</body>
</html>
