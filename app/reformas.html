<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#0b1120" />
    <title>Reformas | Viva Haven</title>

    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="apple-touch-icon" href="/icons/icon-192.png" />
    <link rel="icon" type="image/png" sizes="192x192" href="/icons/icon-192.png" />
    <link rel="icon" type="image/png" sizes="512x512" href="/icons/icon-512.png" />
    <link rel="stylesheet" href="/css/styles.css" />
    <script type="module" src="/js/core-init.js"></script>

    <script>
      (function () {
        try {
          var saved = localStorage.getItem('condoflow-theme');
          if (saved === 'dark') document.documentElement.setAttribute('data-theme', 'dark');
        } catch (e) {}
      })();
    </script>
  </head>

  <body>
    <main class="container" style="padding-top: 28px; padding-bottom: 72px;">
      <div style="display:flex;align-items:center;gap:12px;justify-content:space-between;flex-wrap:wrap;">
        <div>
          <h1 class="section__title" style="margin-bottom: 6px;">Reformas</h1>
          <p class="section__subtitle" style="margin-left:0;margin-right:0;max-width:900px;">
            Solicite e acompanhe reformas na sua unidade.
          </p>
        </div>

        <div style="display:flex;gap:10px;align-items:center;flex-wrap:wrap;">
          <span data-vh-context-anchor="1"></span>
          <a class="btn btn--ghost" href="/perfil.html">Voltar</a>
          <button id="logoutBtn" class="btn btn--ghost" type="button">Sair</button>
        </div>
      </div>

      <section class="card" style="margin-top: 14px;">
        <div style="display:flex;gap:12px;align-items:flex-end;flex-wrap:wrap;">
          <div style="flex:1;min-width:240px;">
            <label style="display:block;font-weight:700;font-size:12px;margin-bottom:6px;">Condomínio</label>
            <div id="ctxCondoName" class="input" style="width:100%;display:flex;align-items:center;min-height:42px;">—</div>
          </div>
          <div>
            <button id="pickCtxBtn" class="btn btn--ghost" type="button">Trocar</button>
            <button id="refreshBtn" class="btn" type="button">Atualizar</button>
          </div>
        </div>
      </section>

      <div id="status" style="margin-top: 10px; font-size: 12px; color: var(--muted);"></div>

      <section style="margin-top: 14px; display:grid; gap:14px; grid-template-columns: 1fr;">
        <article class="card">
          <h2 class="card__title" style="margin-bottom: 10px;">Minhas solicitações</h2>
          <div id="reformList" style="display:grid;gap:10px;"></div>
        </article>

        <article class="card">
          <h2 class="card__title" style="margin-bottom: 10px;">Solicitar reforma</h2>
          <form id="reformForm" style="display:grid;gap:10px;">
            <div>
              <label style="display:block;font-weight:700;font-size:12px;margin-bottom:6px;">Título</label>
              <input id="reformTitle" class="input" placeholder="Ex: Reforma de banheiro" required />
            </div>

            <div>
              <label style="display:block;font-weight:700;font-size:12px;margin-bottom:6px;">Descrição</label>
              <textarea id="reformDesc" class="input" rows="3" placeholder="Descreva o que será feito" required></textarea>
            </div>

            <div style="display:grid;gap:10px;grid-template-columns: repeat(3, minmax(0, 1fr));">
              <div>
                <label style="display:block;font-weight:700;font-size:12px;margin-bottom:6px;">Unidade</label>
                <input id="reformUnitLabel" class="input" placeholder="Ex: Bloco A • 301" />
              </div>
              <div>
                <label style="display:block;font-weight:700;font-size:12px;margin-bottom:6px;">Início</label>
                <input id="reformStart" class="input" type="date" />
              </div>
              <div>
                <label style="display:block;font-weight:700;font-size:12px;margin-bottom:6px;">Fim</label>
                <input id="reformEnd" class="input" type="date" />
              </div>
            </div>

            <div style="display:grid;gap:10px;grid-template-columns: repeat(2, minmax(0, 1fr));">
              <div>
                <label style="display:block;font-weight:700;font-size:12px;margin-bottom:6px;">Contratada</label>
                <input id="reformContractor" class="input" placeholder="Opcional" />
              </div>
              <div>
                <label style="display:block;font-weight:700;font-size:12px;margin-bottom:6px;">Contato</label>
                <input id="reformContact" class="input" placeholder="Opcional" />
              </div>
            </div>

            <div>
              <label style="display:block;font-weight:700;font-size:12px;margin-bottom:6px;">URL do anexo (opcional)</label>
              <input id="reformFileUrl" class="input" type="url" placeholder="https://..." />
              <p style="margin:6px 0 0;font-size:12px;color:var(--muted);">MVP sem upload: você pode anexar uma URL agora ou no detalhe.</p>
            </div>

            <div style="display:flex;gap:10px;flex-wrap:wrap;">
              <button id="reformOpenBtn" class="btn" type="submit">Enviar solicitação</button>
            </div>
          </form>
        </article>

        <article class="card">
          <h2 class="card__title" style="margin-bottom: 10px;">Detalhe</h2>
          <input type="hidden" id="reformId" />
          <div id="reformDetail" style="font-size:12px;color:var(--muted);"></div>
          <div id="reformAttachments" style="display:grid;gap:10px;margin-top:10px;"></div>

          <div style="border-top:1px solid var(--border);padding-top:12px;margin-top:12px;">
            <h3 style="margin:0 0 8px;font-size:13px;">Adicionar anexo</h3>
            <div style="display:flex;gap:10px;flex-wrap:wrap;align-items:center;">
              <input id="addFileUrl" class="input" type="url" placeholder="https://..." style="flex:1;min-width:220px;" />
              <button id="addFileBtn" class="btn" type="button">Enviar</button>
            </div>
            <div style="font-size:12px;color:var(--muted);margin-top:6px;">Cole o link do arquivo para anexar.</div>
          </div>
        </article>
      </section>
    </main>

    <script src="/js/a2hs.js" defer></script>

    <script type="module">
      import { protect } from '/js/route-guard.js';
      import { logoutUser } from '/js/auth.js';
      import { watchAuthAndContext, getActiveContext, openSelector } from '/js/active-context.js';
      import { listUnitReforms, createUnitReform, addUnitReformAttachment } from '/js/modules/works.js';

      await protect(['/app/']);

      const $ = (id) => document.getElementById(id);
      const statusEl = $('status');
      const ctxCondoName = $('ctxCondoName');

      const state = {
        condoId: '',
      };

      function setStatus(msg) {
        statusEl.textContent = msg ? String(msg) : '';
      }

      async function withBusy(btn, fn) {
        if (btn) btn.disabled = true;
        try {
          return await fn();
        } catch (e) {
          setStatus(e && e.message ? e.message : 'Erro');
          throw e;
        } finally {
          if (btn) btn.disabled = false;
        }
      }

      function currentCondoId() {
        return state.condoId ? String(state.condoId) : '';
      }

      function setActiveCondoName(text) {
        if (!ctxCondoName) return;
        ctxCondoName.textContent = text ? String(text) : '—';
      }

      function renderNoContext(container) {
        if (!container) return;
        container.innerHTML =
          '<div class="card" style="padding:12px;">' +
          '  <div style="font-weight:900;">Selecione um condomínio</div>' +
          '  <div style="margin-top:6px;font-size:12px;color:var(--muted);">As reformas dependem do contexto ativo.</div>' +
          '  <div style="display:flex;gap:10px;flex-wrap:wrap;margin-top:12px;">' +
          '    <button id="pickCtxInline" class="btn" type="button">Escolher condomínio</button>' +
          '  </div>' +
          '</div>';

        const btn = container.querySelector('#pickCtxInline');
        if (btn) btn.addEventListener('click', () => openSelector());
      }

      function fmtDateTimeMaybe(v) {
        try {
          if (!v) return '';
          if (typeof v.toDate === 'function') {
            const d = v.toDate();
            return d.toLocaleString('pt-BR');
          }
          if (v instanceof Date) return v.toLocaleString('pt-BR');
          return '';
        } catch (e) {
          return '';
        }
      }

      function renderAttachments(container, attachments) {
        container.innerHTML = '';
        const list = Array.isArray(attachments) ? attachments : [];
        if (list.length === 0) {
          container.innerHTML = '<p style="margin:0;color:var(--muted);font-size:12px;">Sem anexos.</p>';
          return;
        }
        list.forEach((a) => {
          const card = document.createElement('div');
          card.className = 'card';
          card.style.padding = '12px';
          const url = a && a.url ? String(a.url) : '';
          const name = a && a.name ? String(a.name) : 'anexo';
          card.innerHTML =
            '<div style="font-weight:800;margin-bottom:8px;">' + name + '</div>' +
            (url ? '<a class="btn" target="_blank" href="' + url + '">Abrir</a>' : '<div style="font-size:12px;color:var(--muted);">Sem URL</div>');
          container.appendChild(card);
        });
      }

      function renderList(container, items, onPick) {
        container.innerHTML = '';
        if (!items || items.length === 0) {
          container.innerHTML = '<p style="margin:0;color:var(--muted);font-size:12px;">Nenhuma solicitação.</p>';
          return;
        }

        items.forEach((it) => {
          const row = document.createElement('div');
          row.className = 'card';
          row.style.padding = '12px';

          const subtitle = [it.status ? ('status: ' + it.status) : null, it.unitLabel ? ('unidade: ' + it.unitLabel) : null].filter(Boolean).join(' • ');
          row.innerHTML =
            '<div style="display:flex;justify-content:space-between;gap:10px;align-items:center;">' +
            '<div>' +
            '<div style="font-weight:800;">' + (it.title || it.id) + '</div>' +
            '<div style="font-size:12px;color:var(--muted);">' + subtitle + '</div>' +
            '</div>' +
            '<button class="btn btn--ghost" type="button">Abrir</button>' +
            '</div>';

          row.querySelector('button').addEventListener('click', () => onPick(it));
          container.appendChild(row);
        });
      }

      async function refreshReforms() {
        const cId = currentCondoId();

        $('reformId').value = '';
        $('reformDetail').textContent = '';
        $('reformAttachments').innerHTML = '';

        if (!cId) {
          renderNoContext($('reformList'));
          setStatus('Selecione um condomínio.');
          return;
        }

        const items = await listUnitReforms(cId, { mineOnly: true });
        renderList($('reformList'), items, (it) => {
          $('reformId').value = it.id;
          $('reformDetail').innerHTML =
            '<div><strong>Status:</strong> ' + (it.status || '') + '</div>' +
            (it.unitLabel ? '<div><strong>Unidade:</strong> ' + it.unitLabel + '</div>' : '') +
            (it.contractor ? '<div><strong>Contratada:</strong> ' + it.contractor + '</div>' : '') +
            (it.contact ? '<div><strong>Contato:</strong> ' + it.contact + '</div>' : '') +
            (it.decisionNote ? '<div><strong>Obs.:</strong> ' + it.decisionNote + '</div>' : '') +
            (it.updatedAt ? '<div><strong>Atualizado:</strong> ' + fmtDateTimeMaybe(it.updatedAt) + '</div>' : '');

          renderAttachments($('reformAttachments'), it.attachments);
          setStatus('Solicitação selecionada.');
        });
      }

      // Logout
      $('logoutBtn').addEventListener('click', async () => {
        await withBusy($('logoutBtn'), async () => {
          await logoutUser();
          window.location.href = '/login.html';
        });
      });

      $('refreshBtn').addEventListener('click', async () => {
        await withBusy($('refreshBtn'), async () => {
          await refreshReforms();
          setStatus('Atualizado.');
        });
      });

      const pickBtn = $('pickCtxBtn');
      if (pickBtn) pickBtn.addEventListener('click', () => openSelector());

      // Abrir reforma
      $('reformForm').addEventListener('submit', async (e) => {
        e.preventDefault();
        const cId = currentCondoId();
        if (!cId) {
          setStatus('Selecione um condomínio.');
          openSelector();
          return;
        }

        const attachmentUrl = $('reformFileUrl').value;
        const payload = {
          title: $('reformTitle').value,
          description: $('reformDesc').value,
          unitLabel: $('reformUnitLabel').value,
          contractor: $('reformContractor').value,
          contact: $('reformContact').value,
          startDate: $('reformStart').value,
          endDate: $('reformEnd').value,
          attachments: attachmentUrl ? [attachmentUrl] : [],
        };

        await withBusy($('reformOpenBtn'), async () => {
          await createUnitReform(cId, payload);
          $('reformTitle').value = '';
          $('reformDesc').value = '';
          $('reformUnitLabel').value = '';
          $('reformContractor').value = '';
          $('reformContact').value = '';
          $('reformStart').value = '';
          $('reformEnd').value = '';
          $('reformFileUrl').value = '';
          await refreshReforms();
          setStatus('Solicitação enviada.');
        });
      });

      // Adicionar anexo
      $('addFileBtn').addEventListener('click', async () => {
        const cId = currentCondoId();
        const rId = $('reformId').value;
        const url = $('addFileUrl').value;
        if (!cId || !rId) {
          setStatus('Selecione uma solicitação.');
          if (!cId) openSelector();
          return;
        }
        if (!url) {
          setStatus('Informe uma URL.');
          return;
        }

        await withBusy($('addFileBtn'), async () => {
          await addUnitReformAttachment(cId, rId, url);
          $('addFileUrl').value = '';
          await refreshReforms();
          setStatus('Anexo enviado.');
        });
      });

      // Contexto vem do active-context.js
      watchAuthAndContext((ev) => {
        const ctx = ev && ev.context ? ev.context : getActiveContext();
        state.condoId = ctx && ctx.condoId ? String(ctx.condoId) : '';

        try {
          const condos = ev && Array.isArray(ev.condos) ? ev.condos : [];
          const picked = condos.find((c) => c && c.id === state.condoId);
          setActiveCondoName(picked && picked.name ? picked.name : (state.condoId || '—'));
        } catch (e) {
          setActiveCondoName(state.condoId || '—');
        }

        refreshReforms().catch(() => {});
      });

      const initial = getActiveContext();
      state.condoId = initial && initial.condoId ? String(initial.condoId) : '';
      setActiveCondoName(state.condoId || '—');
      await withBusy(null, refreshReforms);
    </script>

    <script>
      (function () {
        try {
          if (!('serviceWorker' in navigator)) return;
          window.addEventListener('load', function () {
            navigator.serviceWorker.register('/sw.js').catch(function () {});
          });
        } catch (e) {}
      })();
    </script>
  </body>
</html>
