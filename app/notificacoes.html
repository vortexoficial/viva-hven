<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#0b1120" />
    <title>Notificações | App do Morador</title>

    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="apple-touch-icon" href="/icons/icon-192.png" />
    <link rel="icon" type="image/png" sizes="192x192" href="/icons/icon-192.png" />
    <link rel="icon" type="image/png" sizes="512x512" href="/icons/icon-512.png" />
    <link rel="stylesheet" href="/css/styles.css" />
    <script type="module" src="/js/core-init.js"></script>
  </head>

  <body>
    <header class="topbar">
      <div class="topbar__left">
        <h1 class="h1">Central de Notificações</h1>
      </div>
      <div class="topbar__right">
        <span data-vh-context-anchor="1"></span>
        <span id="userBadge" class="badge"></span>
        <button id="logoutBtn" class="btn btn--ghost" type="button">Sair</button>
      </div>
    </header>

    <main class="container">
      <section class="card">
        <div class="vhSectionHead">
          <h2 class="h2">Condomínio ativo</h2>
          <div style="display:flex;gap:8px;flex-wrap:wrap;">
            <button id="pickCtxBtn" class="btn btn--ghost" type="button">Trocar</button>
            <button id="refreshBtn" class="btn" type="button">Atualizar</button>
          </div>
        </div>
        <p id="ctxCondoName" class="muted">—</p>
      </section>

      <section class="card">
        <div class="vhSectionHead">
          <h2 class="h2">Feed</h2>
          <span id="summary" class="badge">0 itens</span>
        </div>
        <div id="feedList" class="list"></div>
      </section>

      <div id="status" class="muted" style="font-size:12px;"></div>
    </main>

    <script type="module">
      import { protect } from '/js/route-guard.js';
      import { logoutUser } from '/js/auth.js';
      import { initFirebase } from '/js/firebase-init.js';
      import { watchAuthAndContext, getActiveContext, openSelector } from '/js/active-context.js';
      import { listNotificationFeed, markNotificationItemRead } from '/js/modules/notifications.js';

      await protect(['/app/']);

      const $ = (id) => document.getElementById(id);

      const state = {
        condoId: null,
        feed: [],
      };

      function setStatus(msg, isErr) {
        const el = $('status');
        if (!el) return;
        el.textContent = msg || '';
        el.style.color = isErr ? 'var(--danger)' : 'var(--muted)';
      }

      function renderFeed() {
        const root = $('feedList');
        if (!root) return;

        $('summary').textContent = `${state.feed.length} item(ns)`;

        if (!state.feed.length) {
          root.innerHTML = '<div class="emptyState"><p class="emptyState__title">Sem notificações</p><p class="emptyState__sub">Você está com tudo atualizado.</p></div>';
          return;
        }

        root.innerHTML = state.feed
          .map((item) => {
            const readBadge = item.read
              ? '<span class="badge">Lida</span>'
              : `<button class="btn btn--ghost" type="button" data-read="${item.kind}:${item.id}">Marcar lida</button>`;

            return `
              <div class="list__item">
                <div>
                  <div class="list__title">${item.title}</div>
                  <div class="list__sub">${item.preview || ''}</div>
                  <div class="list__sub" style="margin-top:4px;">${item.meta || ''}</div>
                </div>
                <div class="list__meta" style="display:grid;gap:8px;justify-items:end;">
                  <a class="btn btn--ghost" href="${item.actionHref}">Abrir</a>
                  ${readBadge}
                </div>
              </div>
            `;
          })
          .join('');

        root.querySelectorAll('button[data-read]').forEach((btn) => {
          btn.addEventListener('click', async () => {
            const raw = String(btn.getAttribute('data-read') || '');
            const [kind, id] = raw.split(':');
            const target = state.feed.find((f) => f.kind === kind && f.id === id);
            if (!target) return;
            btn.disabled = true;
            try {
              await markNotificationItemRead(state.condoId, target);
              await refreshAll();
            } catch (e) {
              setStatus(e && e.message ? e.message : String(e), true);
            } finally {
              btn.disabled = false;
            }
          });
        });
      }

      async function refreshAll() {
        if (!state.condoId) {
          state.feed = [];
          renderFeed();
          setStatus('Selecione um condomínio para carregar as notificações.', true);
          return;
        }

        setStatus('Carregando notificações...');
        try {
          state.feed = await listNotificationFeed(state.condoId, { limit: 50 });
          renderFeed();
          setStatus('Notificações atualizadas.');
        } catch (e) {
          setStatus(e && e.message ? e.message : String(e), true);
        }
      }

      async function bootstrap() {
        const { auth } = await initFirebase();

        $('logoutBtn').addEventListener('click', async () => {
          await auth.signOut();
          await logoutUser().catch(() => {});
          location.href = '/login.html';
        });

        $('refreshBtn').addEventListener('click', refreshAll);

        const pickBtn = $('pickCtxBtn');
        if (pickBtn) pickBtn.addEventListener('click', () => openSelector());

        watchAuthAndContext((ev) => {
          const user = ev && ev.user ? ev.user : null;
          if (user) $('userBadge').textContent = user.email || user.uid;

          const ctx = ev && ev.context ? ev.context : getActiveContext();
          state.condoId = ctx && ctx.condoId ? String(ctx.condoId) : null;

          try {
            const condos = ev && Array.isArray(ev.condos) ? ev.condos : [];
            const picked = condos.find((c) => c && c.id === state.condoId);
            $('ctxCondoName').textContent = picked && picked.name ? picked.name : (state.condoId || '—');
          } catch (e) {
            $('ctxCondoName').textContent = state.condoId || '—';
          }

          refreshAll().catch(() => {});
        });

        const initial = getActiveContext();
        state.condoId = initial.condoId || null;
        await refreshAll();
      }

      bootstrap();
    </script>
  </body>
</html>
