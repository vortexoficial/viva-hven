<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#0b1120" />
    <title>Manutenção | Admin</title>

    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="apple-touch-icon" href="/icons/icon-192.png" />
    <link rel="icon" type="image/png" sizes="192x192" href="/icons/icon-192.png" />
    <link rel="icon" type="image/png" sizes="512x512" href="/icons/icon-512.png" />
    <link rel="stylesheet" href="/css/styles.css" />
    <script type="module" src="/js/core-init.js"></script>
    <script type="module" src="/js/admin-shell.js"></script>

    <script>
      (function () {
        try {
          var saved = localStorage.getItem('condoflow-theme');
          if (saved === 'dark') document.documentElement.setAttribute('data-theme', 'dark');
        } catch (e) {}
      })();
    </script>
  </head>

  <body>
    <main class="container" style="padding-top: 28px; padding-bottom: 56px;">
      <div style="display:flex;align-items:center;gap:12px;justify-content:space-between;flex-wrap:wrap;">
        <div>
          <h1 class="section__title" style="margin-bottom: 6px;">Manutenção (Admin)</h1>
          <p class="section__subtitle" style="margin-left:0;margin-right:0;max-width:900px;">
            Ativos, planos preventivos e chamados corretivos (SLA/prioridade/status).
          </p>
        </div>

        <div style="display:flex;gap:10px;align-items:center;flex-wrap:wrap;">
          <span data-vh-context-anchor="1"></span>
          <a class="btn btn--ghost" href="/admin/dashboard.html">Voltar</a>
          <button id="logoutBtn" class="btn btn--ghost" type="button">Sair</button>
        </div>
      </div>

      <section class="card" style="margin-top: 14px;">
        <div style="display:flex;gap:12px;align-items:flex-end;flex-wrap:wrap;">
          <div style="flex:1;min-width:240px;">
            <label style="display:block;font-weight:700;font-size:12px;margin-bottom:6px;">Condomínio</label>
            <div id="ctxCondoName" class="input" style="width:100%;display:flex;align-items:center;min-height:42px;">—</div>
          </div>
          <div>
            <button id="pickCtxBtn" class="btn btn--ghost" type="button">Trocar</button>
            <button id="refreshBtn" class="btn" type="button">Atualizar</button>
          </div>
        </div>
      </section>

      <div id="status" style="margin-top: 10px; font-size: 12px; color: var(--muted);"></div>

      <section style="margin-top: 14px; display:grid; gap:14px; grid-template-columns: 1fr;">
        <article class="card">
          <h2 class="card__title" style="margin-bottom: 10px;">Ativos</h2>

          <div id="assetList" style="display:grid;gap:10px;margin-bottom:12px;"></div>

          <form id="assetForm" style="display:grid;gap:10px;">
            <input type="hidden" id="assetId" />

            <div style="display:grid;gap:10px;grid-template-columns: repeat(2, minmax(0, 1fr));">
              <div>
                <label style="display:block;font-weight:700;font-size:12px;margin-bottom:6px;">Nome</label>
                <input id="assetName" class="input" placeholder="Ex: Elevador Social" required />
              </div>
              <div>
                <label style="display:block;font-weight:700;font-size:12px;margin-bottom:6px;">Tipo</label>
                <input id="assetType" class="input" placeholder="Ex: elevador" />
              </div>
            </div>

            <div style="display:grid;gap:10px;grid-template-columns: repeat(2, minmax(0, 1fr));">
              <div>
                <label style="display:block;font-weight:700;font-size:12px;margin-bottom:6px;">Fabricante</label>
                <input id="assetManufacturer" class="input" placeholder="Opcional" />
              </div>
              <div>
                <label style="display:block;font-weight:700;font-size:12px;margin-bottom:6px;">Modelo</label>
                <input id="assetModel" class="input" placeholder="Opcional" />
              </div>
            </div>

            <div style="display:grid;gap:10px;grid-template-columns: repeat(2, minmax(0, 1fr));">
              <div>
                <label style="display:block;font-weight:700;font-size:12px;margin-bottom:6px;">Local</label>
                <input id="assetLocation" class="input" placeholder="Opcional" />
              </div>
              <div>
                <label style="display:block;font-weight:700;font-size:12px;margin-bottom:6px;">Serial</label>
                <input id="assetSerial" class="input" placeholder="Opcional" />
              </div>
            </div>

            <div style="display:grid;gap:10px;grid-template-columns: repeat(2, minmax(0, 1fr));">
              <div>
                <label style="display:block;font-weight:700;font-size:12px;margin-bottom:6px;">Garantia até</label>
                <input id="assetWarrantyUntil" class="input" type="date" />
              </div>
              <div>
                <label style="display:block;font-weight:700;font-size:12px;margin-bottom:6px;">Contrato (contractId)</label>
                <input id="assetContractId" class="input" placeholder="Opcional" list="contractsDatalist" />
              </div>
            </div>

            <div>
              <label style="display:block;font-weight:700;font-size:12px;margin-bottom:6px;">Status</label>
              <select id="assetStatus" class="input">
                <option value="ativo">Ativo</option>
                <option value="inativo">Inativo</option>
                <option value="manutencao">Em manutenção</option>
              </select>
            </div>

            <div>
              <label style="display:block;font-weight:700;font-size:12px;margin-bottom:6px;">Notas</label>
              <textarea id="assetNotes" class="input" rows="2" placeholder="Opcional"></textarea>
            </div>

            <div style="display:flex;gap:10px;flex-wrap:wrap;">
              <button id="assetSaveBtn" class="btn" type="submit">Salvar</button>
              <button id="assetClearBtn" class="btn btn--ghost" type="button">Limpar</button>
              <button id="assetDeleteBtn" class="btn btn--ghost" type="button">Excluir</button>
            </div>
          </form>
        </article>

        <article class="card">
          <h2 class="card__title" style="margin-bottom: 10px;">Planos preventivos</h2>

          <div id="planList" style="display:grid;gap:10px;margin-bottom:12px;"></div>

          <form id="planForm" style="display:grid;gap:10px;">
            <input type="hidden" id="planId" />

            <div>
              <label style="display:block;font-weight:700;font-size:12px;margin-bottom:6px;">Título</label>
              <input id="planTitle" class="input" placeholder="Ex: Revisão elevadores" required />
            </div>

            <div style="display:grid;gap:10px;grid-template-columns: repeat(3, minmax(0, 1fr));">
              <div>
                <label style="display:block;font-weight:700;font-size:12px;margin-bottom:6px;">Ano</label>
                <input id="planYear" class="input" type="number" min="2000" placeholder="Ex: 2026" />
              </div>
              <div>
                <label style="display:block;font-weight:700;font-size:12px;margin-bottom:6px;">Tipo do ativo (opcional)</label>
                <input id="planAssetType" class="input" placeholder="Ex: elevador" />
              </div>
              <div>
                <label style="display:block;font-weight:700;font-size:12px;margin-bottom:6px;">Ativo</label>
                <select id="planAssetId" class="input">
                  <option value="">(Opcional)</option>
                </select>
              </div>
            </div>

            <div style="display:grid;gap:10px;grid-template-columns: repeat(3, minmax(0, 1fr));">
              <div>
                <label style="display:block;font-weight:700;font-size:12px;margin-bottom:6px;">Frequência (dias)</label>
                <input id="planFreq" class="input" type="number" min="1" placeholder="Ex: 30" required />
              </div>
              <div>
                <label style="display:block;font-weight:700;font-size:12px;margin-bottom:6px;">Próxima data</label>
                <input id="planNext" class="input" type="date" required />
              </div>
              <div>
                <label style="display:block;font-weight:700;font-size:12px;margin-bottom:6px;">Alertar (dias antes)</label>
                <input id="planAlertDays" class="input" type="number" min="0" placeholder="Ex: 7" />
              </div>
            </div>

            <div>
              <label style="display:block;font-weight:700;font-size:12px;margin-bottom:6px;">Checklist (uma linha por item)</label>
              <textarea id="planChecklist" class="input" rows="3" placeholder="Ex:\n- Verificar cabos\n- Testar alarme\n- Lubrificar trilhos"></textarea>
            </div>

            <div>
              <label style="display:block;font-weight:700;font-size:12px;margin-bottom:6px;">Status</label>
              <select id="planStatus" class="input">
                <option value="ativo">Ativo</option>
                <option value="pausado">Pausado</option>
              </select>
            </div>

            <div>
              <label style="display:block;font-weight:700;font-size:12px;margin-bottom:6px;">Notas</label>
              <textarea id="planNotes" class="input" rows="2" placeholder="Opcional"></textarea>
            </div>

            <div style="display:flex;gap:10px;flex-wrap:wrap;">
              <button id="planSaveBtn" class="btn" type="submit">Salvar</button>
              <button id="planClearBtn" class="btn btn--ghost" type="button">Limpar</button>
              <button id="planDeleteBtn" class="btn btn--ghost" type="button">Excluir</button>
            </div>
          </form>

          <div style="border-top:1px solid var(--border);margin-top:14px;padding-top:12px;">
            <h3 style="margin:0 0 8px;font-size:13px;">Agenda / execuções</h3>
            <div id="planExecList" style="display:grid;gap:10px;"></div>
            <div style="display:grid;gap:10px;margin-top:10px;grid-template-columns: repeat(3, minmax(0, 1fr));">
              <div>
                <label style="display:block;font-weight:700;font-size:12px;margin-bottom:6px;">Executado em</label>
                <input id="planExecAt" class="input" type="date" />
              </div>
              <div>
                <label style="display:block;font-weight:700;font-size:12px;margin-bottom:6px;">Próxima data (opcional)</label>
                <input id="planExecNext" class="input" type="date" />
              </div>
              <div>
                <label style="display:block;font-weight:700;font-size:12px;margin-bottom:6px;">Notas (opcional)</label>
                <input id="planExecNotes" class="input" placeholder="Opcional" />
              </div>
            </div>
            <div style="display:flex;gap:10px;flex-wrap:wrap;margin-top:10px;">
              <button id="planCompleteBtn" class="btn btn--ghost" type="button">Registrar execução</button>
            </div>
          </div>
        </article>

        <article class="card">
          <h2 class="card__title" style="margin-bottom: 10px;">Chamados</h2>

          <div style="display:flex;gap:10px;align-items:flex-end;flex-wrap:wrap;margin-bottom:10px;">
            <div style="min-width:220px;">
              <label style="display:block;font-weight:700;font-size:12px;margin-bottom:6px;">Status</label>
              <select id="ticketFilterStatus" class="input">
                <option value="">(todos)</option>
                <option value="aberto">aberto</option>
                <option value="em_andamento">em_andamento</option>
                <option value="resolvido">resolvido</option>
                <option value="fechado">fechado</option>
              </select>
            </div>
            <div style="min-width:220px;">
              <label style="display:block;font-weight:700;font-size:12px;margin-bottom:6px;">Prioridade</label>
              <select id="ticketFilterPriority" class="input">
                <option value="">(todas)</option>
                <option value="baixa">baixa</option>
                <option value="media">media</option>
                <option value="alta">alta</option>
                <option value="urgente">urgente</option>
              </select>
            </div>
            <div style="min-width:220px;">
              <label style="display:block;font-weight:700;font-size:12px;margin-bottom:6px;">Vencimento (SLA)</label>
              <select id="ticketFilterDue" class="input">
                <option value="">(todos)</option>
                <option value="overdue">vencidos</option>
                <option value="dueSoon">vencendo hoje</option>
              </select>
            </div>
          </div>

          <div id="ticketList" style="display:grid;gap:10px;margin-bottom:12px;"></div>

          <form id="ticketForm" style="display:grid;gap:10px;">
            <input type="hidden" id="ticketId" />

            <div>
              <label style="display:block;font-weight:700;font-size:12px;margin-bottom:6px;">Título</label>
              <input id="ticketTitle" class="input" required />
            </div>

            <div>
              <label style="display:block;font-weight:700;font-size:12px;margin-bottom:6px;">Descrição</label>
              <textarea id="ticketDesc" class="input" rows="3" required></textarea>
            </div>

            <div style="display:grid;gap:10px;grid-template-columns: repeat(3, minmax(0, 1fr));">
              <div>
                <label style="display:block;font-weight:700;font-size:12px;margin-bottom:6px;">Ativo</label>
                <select id="ticketAssetId" class="input">
                  <option value="">(Opcional)</option>
                </select>
              </div>
              <div>
                <label style="display:block;font-weight:700;font-size:12px;margin-bottom:6px;">Prioridade</label>
                <select id="ticketPriority" class="input">
                  <option value="baixa">Baixa</option>
                  <option value="media" selected>Média</option>
                  <option value="alta">Alta</option>
                  <option value="urgente">Urgente</option>
                </select>
              </div>
              <div>
                <label style="display:block;font-weight:700;font-size:12px;margin-bottom:6px;">SLA (horas)</label>
                <input id="ticketSla" class="input" type="number" min="1" placeholder="Ex: 24" />
              </div>
            </div>

            <div style="display:grid;gap:10px;grid-template-columns: repeat(3, minmax(0, 1fr));">
              <div>
                <label style="display:block;font-weight:700;font-size:12px;margin-bottom:6px;">Status</label>
                <select id="ticketStatus" class="input">
                  <option value="aberto">Aberto</option>
                  <option value="em_andamento">Em andamento</option>
                  <option value="resolvido">Resolvido</option>
                  <option value="fechado">Fechado</option>
                </select>
              </div>
              <div>
                <label style="display:block;font-weight:700;font-size:12px;margin-bottom:6px;">Responsável (uid)</label>
                <input id="ticketAssigned" class="input" placeholder="Opcional" />
              </div>
              <div>
                <label style="display:block;font-weight:700;font-size:12px;margin-bottom:6px;">Adicionar foto</label>
                <input id="ticketPhotoUrl" class="input" type="url" placeholder="https://..." />
              </div>
            </div>

            <div style="display:flex;gap:10px;flex-wrap:wrap;">
              <button id="ticketSaveBtn" class="btn" type="submit">Salvar</button>
              <button id="ticketClearBtn" class="btn btn--ghost" type="button">Limpar</button>
              <button id="ticketDeleteBtn" class="btn btn--ghost" type="button">Excluir</button>
              <button id="convertToWoBtn" class="btn btn--ghost" type="button">Converter em OS</button>
            </div>

            <div id="ticketPhotos" style="display:grid;gap:10px;"></div>
          </form>
        </article>

          <article class="card">
            <h2 class="card__title" style="margin-bottom: 10px;">Ordens de serviço (corretiva)</h2>

            <div style="display:flex;gap:10px;align-items:flex-end;flex-wrap:wrap;margin-bottom:10px;">
              <div style="min-width:220px;">
                <label style="display:block;font-weight:700;font-size:12px;margin-bottom:6px;">Status</label>
                <select id="woFilterStatus" class="input">
                  <option value="">(todos)</option>
                  <option value="aberto">aberto</option>
                  <option value="triagem">triagem</option>
                  <option value="aprovado">aprovado</option>
                  <option value="em_andamento">em_andamento</option>
                  <option value="aguardando_fornecedor">aguardando_fornecedor</option>
                  <option value="resolvido">resolvido</option>
                  <option value="fechado">fechado</option>
                  <option value="cancelado">cancelado</option>
                </select>
              </div>
              <div style="min-width:220px;">
                <label style="display:block;font-weight:700;font-size:12px;margin-bottom:6px;">Prioridade</label>
                <select id="woFilterPriority" class="input">
                  <option value="">(todas)</option>
                  <option value="baixa">baixa</option>
                  <option value="media">media</option>
                  <option value="alta">alta</option>
                  <option value="urgente">urgente</option>
                </select>
              </div>
              <div style="min-width:220px;">
                <label style="display:block;font-weight:700;font-size:12px;margin-bottom:6px;">Vencimento (SLA)</label>
                <select id="woFilterDue" class="input">
                  <option value="">(todos)</option>
                  <option value="overdue">vencidos</option>
                  <option value="dueSoon">vencendo hoje</option>
                </select>
              </div>
            </div>

            <div id="woList" style="display:grid;gap:10px;margin-bottom:12px;"></div>

            <form id="woForm" style="display:grid;gap:10px;">
              <input type="hidden" id="woId" />

              <div>
                <label style="display:block;font-weight:700;font-size:12px;margin-bottom:6px;">Título</label>
                <input id="woTitle" class="input" required />
              </div>
              <div>
                <label style="display:block;font-weight:700;font-size:12px;margin-bottom:6px;">Descrição</label>
                <textarea id="woDesc" class="input" rows="3" required></textarea>
              </div>

              <div style="display:grid;gap:10px;grid-template-columns: repeat(3, minmax(0, 1fr));">
                <div>
                  <label style="display:block;font-weight:700;font-size:12px;margin-bottom:6px;">Ativo</label>
                  <select id="woAssetId" class="input">
                    <option value="">(Opcional)</option>
                  </select>
                </div>
                <div>
                  <label style="display:block;font-weight:700;font-size:12px;margin-bottom:6px;">Unidade (unitId)</label>
                  <input id="woUnitId" class="input" placeholder="Opcional" />
                </div>
                <div>
                  <label style="display:block;font-weight:700;font-size:12px;margin-bottom:6px;">Local</label>
                  <input id="woLocation" class="input" placeholder="Opcional" />
                </div>
              </div>

              <div style="display:grid;gap:10px;grid-template-columns: repeat(4, minmax(0, 1fr));">
                <div>
                  <label style="display:block;font-weight:700;font-size:12px;margin-bottom:6px;">Prioridade</label>
                  <select id="woPriority" class="input">
                    <option value="baixa">Baixa</option>
                    <option value="media" selected>Média</option>
                    <option value="alta">Alta</option>
                    <option value="urgente">Urgente</option>
                  </select>
                </div>
                <div>
                  <label style="display:block;font-weight:700;font-size:12px;margin-bottom:6px;">SLA (horas)</label>
                  <input id="woSla" class="input" type="number" min="1" placeholder="Ex: 24" />
                </div>
                <div>
                  <label style="display:block;font-weight:700;font-size:12px;margin-bottom:6px;">Status</label>
                  <select id="woStatus" class="input">
                    <option value="aberto">aberto</option>
                    <option value="triagem">triagem</option>
                    <option value="aprovado">aprovado</option>
                    <option value="em_andamento">em_andamento</option>
                    <option value="aguardando_fornecedor">aguardando_fornecedor</option>
                    <option value="resolvido">resolvido</option>
                    <option value="fechado">fechado</option>
                    <option value="cancelado">cancelado</option>
                  </select>
                </div>
                <div>
                  <label style="display:block;font-weight:700;font-size:12px;margin-bottom:6px;">Responsável (uid)</label>
                  <input id="woAssigned" class="input" placeholder="Opcional" />
                </div>
              </div>

              <div style="display:grid;gap:10px;grid-template-columns: repeat(3, minmax(0, 1fr));">
                <div>
                  <label style="display:block;font-weight:700;font-size:12px;margin-bottom:6px;">Fornecedor (supplierId)</label>
                  <input id="woSupplierId" class="input" placeholder="Opcional" list="suppliersDatalist" />
                </div>
                <div>
                  <label style="display:block;font-weight:700;font-size:12px;margin-bottom:6px;">Contrato (contractId)</label>
                  <input id="woContractId" class="input" placeholder="Opcional" list="contractsDatalist" />
                </div>
                <div>
                  <label style="display:block;font-weight:700;font-size:12px;margin-bottom:6px;">Custo (R$)</label>
                  <input id="woCost" class="input" placeholder="Opcional (ex: 123,45)" />
                </div>
              </div>

              <div style="display:grid;gap:10px;grid-template-columns: repeat(2, minmax(0, 1fr));">
                <div>
                  <label style="display:block;font-weight:700;font-size:12px;margin-bottom:6px;">Foto (antes) URL</label>
                  <input id="woPhotoBeforeUrl" class="input" type="url" placeholder="https://..." />
                </div>
                <div>
                  <label style="display:block;font-weight:700;font-size:12px;margin-bottom:6px;">Foto (depois) URL</label>
                  <input id="woPhotoAfterUrl" class="input" type="url" placeholder="https://..." />
                </div>
              </div>

              <div style="display:flex;gap:10px;flex-wrap:wrap;">
                <button id="woSaveBtn" class="btn" type="submit">Salvar</button>
                <button id="woClearBtn" class="btn btn--ghost" type="button">Limpar</button>
                <button id="woDeleteBtn" class="btn btn--ghost" type="button">Excluir</button>
              </div>

              <div style="display:grid;gap:10px;">
                <div id="woPhotosBefore" style="display:grid;gap:10px;"></div>
                <div id="woPhotosAfter" style="display:grid;gap:10px;"></div>
              </div>
            </form>
          </article>

          <article class="card">
            <h2 class="card__title" style="margin-bottom: 10px;">Histórico</h2>
            <div style="display:flex;gap:10px;align-items:flex-end;flex-wrap:wrap;margin-bottom:10px;">
              <div style="min-width:260px;flex:1;">
                <label style="display:block;font-weight:700;font-size:12px;margin-bottom:6px;">Por ativo</label>
                <select id="histAssetId" class="input">
                  <option value="">(selecione)</option>
                </select>
              </div>
              <div style="min-width:240px;">
                <label style="display:block;font-weight:700;font-size:12px;margin-bottom:6px;">Por unidade (unitId)</label>
                <input id="histUnitId" class="input" placeholder="Opcional" />
              </div>
              <div>
                <button id="histRefreshBtn" class="btn btn--ghost" type="button">Buscar</button>
              </div>
            </div>
            <div id="historyList" style="display:grid;gap:10px;"></div>
          </article>

          <datalist id="suppliersDatalist"></datalist>
          <datalist id="contractsDatalist"></datalist>
      </section>
    </main>

    <script src="/js/a2hs.js" defer></script>

    <script type="module">
      import { setupAdminPage } from '/js/admin-access.js';
      import { logoutUser } from '/js/auth.js';
      import { watchAuthAndContext, getActiveContext, openSelector } from '/js/active-context.js';
      import { listSuppliers, listContracts } from '/js/modules/contracts.js';
      import {
        listAssets,
        createAsset,
        updateAsset,
        deleteAsset,
        listMaintenancePlans,
        createMaintenancePlan,
        updateMaintenancePlan,
        deleteMaintenancePlan,
        listMaintenanceExecutions,
        completeMaintenancePlan,
        listTickets,
        createTicket,
        updateTicket,
        deleteTicket,
        addTicketPhoto,
        computeDueInfo,
        listWorkOrders,
        createWorkOrder,
        updateWorkOrder,
        deleteWorkOrder,
        convertTicketToWorkOrder,
        listAssetHistory,
      } from '/js/modules/maintenance.js';

      const env = await setupAdminPage({
        rolesAny: ['GESTOR', 'SINDICO', 'ADMINISTRADORA', 'CARTEIRA', 'GESTOR_CARTEIRA', 'ADMIN'],
        logoutBtnId: null,
        userBadgeId: 'userBadge',

      if (!env || env.ok !== true) return;

      const $ = (id) => document.getElementById(id);
      const statusEl = $('status');
      const ctxCondoName = $('ctxCondoName');

      const state = {
        condoId: '',
        suppliers: [],
        contracts: [],
      };

      function setStatus(msg) {
        statusEl.textContent = msg ? String(msg) : '';
      }

      async function withBusy(btn, fn) {
        if (btn) btn.disabled = true;
        try {
          return await fn();
        } catch (e) {
          setStatus(e && e.message ? e.message : 'Erro');
          throw e;
        } finally {
          if (btn) btn.disabled = false;
        }
      }

      function currentCondoId() {
        return state.condoId ? String(state.condoId) : '';
      }

      function setActiveCondoName(text) {
        if (!ctxCondoName) return;
        ctxCondoName.textContent = text ? String(text) : '—';
      }

      function fmtDateMaybe(v) {
        try {
          if (!v) return '';
          if (typeof v.toDate === 'function') {
            const d = v.toDate();
            const yyyy = d.getFullYear();
            const mm = String(d.getMonth() + 1).padStart(2, '0');
            const dd = String(d.getDate()).padStart(2, '0');
            return yyyy + '-' + mm + '-' + dd;
          }
          if (v instanceof Date) {
            const yyyy = v.getFullYear();
            const mm = String(v.getMonth() + 1).padStart(2, '0');
            const dd = String(v.getDate()).padStart(2, '0');
            return yyyy + '-' + mm + '-' + dd;
          }
          return '';
        } catch (e) {
          return '';
        }
      }

      function renderList(container, items, onPick, emptyMsg) {
        container.innerHTML = '';
        if (!items || items.length === 0) {
          container.innerHTML = '<p style="margin:0;color:var(--muted);font-size:12px;">' + (emptyMsg || 'Nenhum registro.') + '</p>';
          return;
        }

        items.forEach((it) => {
          const row = document.createElement('div');
          row.className = 'card';
          row.style.padding = '12px';

          const head = document.createElement('div');
          head.style.display = 'flex';
          head.style.alignItems = 'center';
          head.style.justifyContent = 'space-between';
          head.style.gap = '10px';

          const left = document.createElement('div');
          left.innerHTML = it.__html || '<div style="font-weight:800;">' + (it.title || it.name || it.id) + '</div>';

          const pickBtn = document.createElement('button');
          pickBtn.type = 'button';
          pickBtn.className = 'btn btn--ghost';
          pickBtn.textContent = 'Abrir';
          pickBtn.addEventListener('click', () => onPick(it));

          head.appendChild(left);
          head.appendChild(pickBtn);
          row.appendChild(head);
          container.appendChild(row);
        });
      }

        selectEl.innerHTML = includeEmpty ? '<option value="">(Opcional)</option>' : '';

          const opt = document.createElement('option');
          opt.value = a.id;
          opt.textContent = a.name || a.id;
          selectEl.appendChild(opt);

        const assetsDecorated = assets.map((a) => {

        const plans = await listMaintenancePlans(cId);

          const next = p.nextDueAt ? fmtDateMaybe(p.nextDueAt) : '';
          const sub = [p.assetId ? ('asset: ' + p.assetId) : null, p.frequencyDays ? ('freq: ' + p.frequencyDays + 'd') : null, next ? ('prox: ' + next) : null, p.status ? ('status: ' + p.status) : null]

          return {

            __html:
              '<div style="font-weight:800;">' + (p.title || p.id) + '</div>' +
              '<div style="font-size:12px;color:var(--muted);">' + sub + '</div>',

        renderList($('planList'), plansDecorated, (it) => {
          $('planId').value = it.id;
          $('planTitle').value = it.title || '';
          $('planYear').value = it.year != null ? String(it.year) : '';
          $('planAssetType').value = it.assetType || '';
          $('planAssetId').value = it.assetId || '';
          $('planFreq').value = it.frequencyDays != null ? String(it.frequencyDays) : '';
          $('planNext').value = it.nextDueAt ? fmtDateMaybe(it.nextDueAt) : '';
          $('planAlertDays').value = it.alertDaysBefore != null ? String(it.alertDaysBefore) : '';
          $('planChecklist').value = Array.isArray(it.checklist) ? it.checklist.join('\n') : '';
          $('planStatus').value = it.status || 'ativo';
          $('planNotes').value = it.notes || '';

          // Execuções (histórico do plano)
          $('planExecAt').value = new Date().toISOString().slice(0, 10);

          $('planExecNotes').value = '';
          withBusy(null, async () => {
            const execs = await listMaintenanceExecutions(cId, { planId: it.id });

              const when = e.executedAt ? fmtDateMaybe(e.executedAt) : '';
              return {
                ...e,
                __html:
                  '<div style="font-weight:800;">' + (when || 'execução') + '</div>' +
                  '<div style="font-size:12px;color:var(--muted);">' +
                  [e.executedBy ? ('por: ' + e.executedBy) : null, e.notes ? ('nota: ' + String(e.notes).slice(0, 120)) : null].filter(Boolean).join(' • ') +
                  '</div>',
              };
            });
            renderList($('planExecList'), decorated, () => {}, 'Sem execuções ainda.');
          }).catch(() => {
            renderList($('planExecList'), [], () => {}, 'Sem acesso ou sem execuções.');
          });

          setStatus('Plano selecionado.');

        const ticketStatus = $('ticketFilterStatus') ? String($('ticketFilterStatus').value || '').trim() : '';

        const ticketPriority = $('ticketFilterPriority') ? String($('ticketFilterPriority').value || '').trim() : '';
        const ticketDue = $('ticketFilterDue') ? String($('ticketFilterDue').value || '').trim() : '';

        let filteredTickets = tickets;
        if (ticketPriority) filteredTickets = filteredTickets.filter((t) => String(t.priority || '') === String(ticketPriority));
        if (ticketDue) {
          filteredTickets = filteredTickets.filter((t) => {
            const due = computeDueInfo(t.slaDueAt, 0);
            if (ticketDue === 'overdue') return !!due.overdue;
            if (ticketDue === 'dueSoon') return !!due.dueSoon;
            return true;
          });
        }

        const ticketsDecorated = filteredTickets.map((t) => {
          const sub = [t.status ? ('status: ' + t.status) : null, t.priority ? ('prio: ' + t.priority) : null, t.slaHours ? ('sla: ' + t.slaHours + 'h') : null].filter(Boolean).join(' • ');
          return {
            ...t,
            __html:
              '<div style="font-weight:800;">' + (t.title || t.id) + '</div>' +

          };

        renderList($('ticketList'), ticketsDecorated, (it) => {
          $('ticketId').value = it.id;
          $('ticketTitle').value = it.title || '';
          $('ticketDesc').value = it.description || '';
          $('ticketAssetId').value = it.assetId || '';
          $('ticketPriority').value = it.priority || 'media';
          $('ticketSla').value = it.slaHours != null ? String(it.slaHours) : '';
          $('ticketStatus').value = it.status || 'aberto';
          $('ticketAssigned').value = it.assignedTo || '';
          $('ticketPhotoUrl').value = '';
          renderPhotos($('ticketPhotos'), Array.isArray(it.photos) ? it.photos : []);
          setStatus('Chamado selecionado.');
        });

        // Work orders
        const woStatus = $('woFilterStatus') ? String($('woFilterStatus').value || '').trim() : '';
        const woPriority = $('woFilterPriority') ? String($('woFilterPriority').value || '').trim() : '';
        const woDue = $('woFilterDue') ? String($('woFilterDue').value || '').trim() : '';
        const workOrders = await listWorkOrders(cId, woStatus ? { status: woStatus } : {});

        let filteredWos = workOrders;
        if (woPriority) filteredWos = filteredWos.filter((w) => String(w.priority || '') === String(woPriority));
        if (woDue) {
          filteredWos = filteredWos.filter((w) => {
            const due = computeDueInfo(w.slaDueAt, 0);
            if (woDue === 'overdue') return !!due.overdue;
            if (woDue === 'dueSoon') return !!due.dueSoon;
            return true;
          });
        }

        const woDecorated = (filteredWos || []).map((w) => {
          const sub = [w.status ? ('status: ' + w.status) : null, w.priority ? ('prio: ' + w.priority) : null, w.unitId ? ('unit: ' + w.unitId) : null, w.assetId ? ('asset: ' + w.assetId) : null].filter(Boolean).join(' • ');
          return {
            ...w,
            __html:
              '<div style="font-weight:800;">' + (w.title || w.id) + '</div>' +
              '<div style="font-size:12px;color:var(--muted);">' + sub + '</div>' +
              (w.ticketId ? ('<div style="margin-top:6px;font-size:12px;color:var(--text-2);">ticket: ' + w.ticketId + '</div>') : ''),
          };
        });

        renderList($('woList'), woDecorated, (it) => {
          $('woId').value = it.id;
          $('woTitle').value = it.title || '';
          $('woDesc').value = it.description || '';
          $('woAssetId').value = it.assetId || '';
          $('woUnitId').value = it.unitId || '';
          $('woLocation').value = it.location || '';
          $('woPriority').value = it.priority || 'media';
          $('woSla').value = it.slaHours != null ? String(it.slaHours) : '';
          $('woStatus').value = it.status || 'aberto';
          $('woAssigned').value = it.assignedTo || '';
          $('woSupplierId').value = it.supplierId || '';
          $('woContractId').value = it.contractId || '';
          $('woCost').value = it.costCents != null ? String((Number(it.costCents) / 100).toFixed(2)).replace('.', ',') : '';
          $('woPhotoBeforeUrl').value = '';
          $('woPhotoAfterUrl').value = '';
          renderPhotos($('woPhotosBefore'), Array.isArray(it.photosBefore) ? it.photosBefore : []);
          renderPhotos($('woPhotosAfter'), Array.isArray(it.photosAfter) ? it.photosAfter : []);
          setStatus('OS selecionada.');
        });
      }

          contractId: $('woContractId').value,
          cost: $('woCost').value,
        };

        await withBusy($('woSaveBtn'), async () => {
          if (wId) {
            const patch = { ...data };
            if (beforeUrl) patch.photosBefore = [beforeUrl];
            if (afterUrl) patch.photosAfter = [afterUrl];
            await updateWorkOrder(cId, wId, patch);
            setStatus('OS atualizada.');
          } else {
            const created = await createWorkOrder(cId, {
              ...data,
              photosBefore: beforeUrl ? [beforeUrl] : [],
              photosAfter: afterUrl ? [afterUrl] : [],
            });
            $('woId').value = created.id;
            setStatus('OS criada.');
          }

          $('woPhotoBeforeUrl').value = '';
          $('woPhotoAfterUrl').value = '';
          await refreshAll();
        });
      });

      // Histórico
      $('histRefreshBtn').addEventListener('click', async () => {
        const cId = currentCondoId();
        if (!cId) return;
        const assetId = $('histAssetId').value;
        const unitId = $('histUnitId').value;

        await withBusy($('histRefreshBtn'), async () => {
          if (assetId) {
            const hist = await listAssetHistory(cId, assetId);
            const decorated = (hist.items || []).map((it) => {
              return {
                ...it,
                __html:
                  '<div style="font-weight:800;">' + (it.kind === 'workOrder' ? 'OS' : 'Preventiva') + ': ' + (it.title || '') + '</div>' +
                  '<div style="font-size:12px;color:var(--muted);">' +
                  (it.kind === 'workOrder'
                    ? [it.ref.status ? ('status: ' + it.ref.status) : null, it.ref.priority ? ('prio: ' + it.ref.priority) : null].filter(Boolean).join(' • ')
                    : [it.ref.executedAt ? ('exec: ' + fmtDateMaybe(it.ref.executedAt)) : null].filter(Boolean).join(' • ')
                  ) +
                  '</div>',
              };
            });
            renderList($('historyList'), decorated, () => {}, 'Sem histórico.');
            setStatus('Histórico do ativo carregado.');
            return;
          }

          if (unitId) {
            const wos = await listWorkOrders(cId, { unitId });
            const decorated = (wos || []).map((w) => {
              return {
                ...w,
                __html:
                  '<div style="font-weight:800;">OS: ' + (w.title || w.id) + '</div>' +
                  '<div style="font-size:12px;color:var(--muted);">' +
                  [w.status ? ('status: ' + w.status) : null, w.priority ? ('prio: ' + w.priority) : null].filter(Boolean).join(' • ') +
                  '</div>',
              };
            });
            renderList($('historyList'), decorated, () => {}, 'Sem histórico.');
            setStatus('Histórico da unidade carregado.');
            return;
          }

          renderList($('historyList'), [], () => {}, 'Informe um ativo ou unidade.');
        });
      });

      // Contexto vem do active-context.js
      watchAuthAndContext((ev) => {
        const ctx = ev && ev.context ? ev.context : getActiveContext();
        state.condoId = ctx && ctx.condoId ? String(ctx.condoId) : '';

        try {
          const condos = ev && Array.isArray(ev.condos) ? ev.condos : [];
          const picked = condos.find((c) => c && c.id === state.condoId);
          setActiveCondoName(picked && picked.name ? picked.name : (state.condoId || '—'));
        } catch (e) {
          setActiveCondoName(state.condoId || '—');
        }

        clearAssetForm();
        clearPlanForm();
        clearTicketForm();
        clearWorkOrderForm();
        refreshAll().catch(() => {});
      });

      const initial = getActiveContext();
      state.condoId = initial && initial.condoId ? String(initial.condoId) : '';
      setActiveCondoName(state.condoId || '—');
      wireRefreshFilters();
      await withBusy(null, refreshAll);
    </script>

    <script>
      (function () {
        try {
          if (!('serviceWorker' in navigator)) return;
          window.addEventListener('load', function () {
            navigator.serviceWorker.register('/sw.js').catch(function () {});
          });
        } catch (e) {}
      })();
    </script>
  </body>
</html>
