<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#0b1120" />
    <title>Assembleias | Admin</title>

    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="apple-touch-icon" href="/icons/icon-192.png" />
    <link rel="icon" type="image/png" sizes="192x192" href="/icons/icon-192.png" />
    <link rel="icon" type="image/png" sizes="512x512" href="/icons/icon-512.png" />
    <link rel="stylesheet" href="/css/styles.css" />
    <script type="module" src="/js/core-init.js"></script>
    <script type="module" src="/js/admin-shell.js"></script>

    <script>
      (function () {
        try {
          var saved = localStorage.getItem('condoflow-theme');
          if (saved === 'dark') document.documentElement.setAttribute('data-theme', 'dark');
        } catch (e) {}
      })();
    </script>
  </head>

  <body>
    <main class="container" style="padding-top: 28px; padding-bottom: 56px;">
      <div style="display:flex;align-items:center;gap:12px;justify-content:space-between;flex-wrap:wrap;">
        <div>
          <h1 class="section__title" style="margin-bottom: 6px;">Assembleias (Admin)</h1>
          <p class="section__subtitle" style="margin-left:0;margin-right:0;max-width:900px;">
            Criar, convocar, abrir/fechar votação, gerar ata, procurações e assinaturas.
          </p>
        </div>

        <div style="display:flex;gap:10px;align-items:center;flex-wrap:wrap;">
          <span data-vh-context-anchor="1"></span>
          <a class="btn btn--ghost" href="/admin/dashboard.html">Voltar</a>
          <button id="logoutBtn" class="btn btn--ghost" type="button">Sair</button>
        </div>
      </div>

      <section class="card" style="margin-top: 14px;">
        <div style="display:flex;gap:12px;align-items:flex-end;flex-wrap:wrap;">
          <div style="flex:1;min-width:240px;">
            <label style="display:block;font-weight:700;font-size:12px;margin-bottom:6px;">Condomínio</label>
            <div id="ctxCondoName" class="input" style="width:100%;display:flex;align-items:center;min-height:42px;">—</div>
          </div>
          <div>
            <button id="pickCtxBtn" class="btn btn--ghost" type="button">Trocar</button>
            <button id="refreshBtn" class="btn" type="button">Atualizar</button>
          </div>
        </div>
      </section>

      <div id="status" style="margin-top: 10px; font-size: 12px; color: var(--muted);"></div>

      <section style="margin-top: 14px; display:grid; gap:14px; grid-template-columns: 1fr;">
        <article class="card">
          <h2 class="card__title" style="margin-bottom: 10px;">Lista</h2>
          <div style="display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-bottom:10px;">
            <input id="searchKeyword" class="input" placeholder="Buscar por palavra (ex.: orçamento)" style="min-width:260px;flex:1;" />
            <button class="btn btn--ghost" type="button" id="searchBtn">Buscar</button>
            <button class="btn btn--ghost" type="button" id="clearSearchBtn">Limpar</button>
          </div>
          <div id="assemblyList" style="display:grid;gap:10px;"></div>
        </article>

        <article class="card">
          <h2 class="card__title" style="margin-bottom: 10px;">Formulário</h2>
          <form id="assemblyForm" style="display:grid;gap:10px;">
            <input type="hidden" id="assemblyId" />

            <div>
              <label style="display:block;font-weight:700;font-size:12px;margin-bottom:6px;">Título</label>
              <input id="assemblyTitle" class="input" placeholder="Ex: Assembleia Ordinária" required />
            </div>

            <div style="display:grid;gap:10px;grid-template-columns: repeat(2, minmax(0, 1fr));">
              <div>
                <label style="display:block;font-weight:700;font-size:12px;margin-bottom:6px;">Data</label>
                <input id="assemblyDate" class="input" type="date" />
              </div>
              <div>
                <label style="display:block;font-weight:700;font-size:12px;margin-bottom:6px;">Local</label>
                <input id="assemblyLocation" class="input" placeholder="Ex: Salão de festas" />
              </div>
            </div>

            <div>
              <label style="display:block;font-weight:700;font-size:12px;margin-bottom:6px;">Texto da convocação</label>
              <textarea id="assemblyNotice" class="input" rows="3" placeholder="Opcional"></textarea>
            </div>

            <div>
              <label style="display:block;font-weight:700;font-size:12px;margin-bottom:6px;">Pauta</label>
              <textarea id="assemblyAgenda" class="input" rows="3" placeholder="Opcional"></textarea>
            </div>

            <div style="display:grid;gap:10px;grid-template-columns: repeat(2, minmax(0, 1fr));">
              <div>
                <label style="display:block;font-weight:700;font-size:12px;margin-bottom:6px;">Modo de voto</label>
                <select id="voteMode" class="input">
                  <option value="unit">Por unidade (1 unidade = 1 voto)</option>
                  <option value="user">Por usuário</option>
                </select>
              </div>
              <div>
                <label style="display:block;font-weight:700;font-size:12px;margin-bottom:6px;">Quórum</label>
                <div id="quorumBox" class="input" style="width:100%;display:flex;align-items:center;min-height:42px;">—</div>
              </div>
            </div>

            <div style="display:flex;gap:10px;flex-wrap:wrap;">
              <button class="btn" type="submit" id="assemblySaveBtn">Salvar</button>
              <button class="btn btn--ghost" type="button" id="assemblyClearBtn">Limpar</button>
              <button class="btn btn--ghost" type="button" id="assemblyDeleteBtn">Excluir</button>
            </div>

            <div style="display:flex;gap:10px;flex-wrap:wrap;">
              <button class="btn btn--ghost" type="button" id="callBtn">Convocar</button>
              <button class="btn btn--ghost" type="button" id="openVoteBtn">Abrir votação</button>
              <button class="btn btn--ghost" type="button" id="closeVoteBtn">Fechar votação</button>
            </div>
          </form>
        </article>

        <article class="card">
          <h2 class="card__title" style="margin-bottom: 10px;">Ata</h2>
          <div style="display:flex;gap:10px;flex-wrap:wrap;margin-bottom:10px;">
            <button class="btn btn--ghost" type="button" id="genMinutesBtn">Gerar texto</button>
            <button class="btn" type="button" id="saveMinutesBtn">Salvar ata</button>
          </div>
          <textarea id="minutesText" class="input" rows="10" placeholder="A ata será gerada aqui (ou você pode editar manualmente)."></textarea>
          <p style="margin:8px 0 0;font-size:12px;color:var(--muted);">A ata é salva em <code>assemblies/{assemblyId}/minutes/latest</code>.</p>

          <div style="margin-top:12px;border-top:1px solid var(--border);padding-top:12px;">
            <h3 style="margin:0 0 8px;font-size:13px;">Histórico de versões</h3>
            <div id="minutesHistory" style="display:grid;gap:8px;"></div>
          </div>
        </article>

        <article class="card">
          <h2 class="card__title" style="margin-bottom: 10px;">Procurações</h2>
          <div id="proxiesList" style="display:grid;gap:8px;margin-bottom:10px;"></div>

          <div style="display:grid;gap:10px;grid-template-columns: repeat(2, minmax(0, 1fr));">
            <div>
              <label style="display:block;font-weight:700;font-size:12px;margin-bottom:6px;">UnitId</label>
              <input id="proxyUnitId" class="input" placeholder="Ex: unit_123" />
            </div>
            <div>
              <label style="display:block;font-weight:700;font-size:12px;margin-bottom:6px;">Delegate UID</label>
              <input id="proxyDelegateUid" class="input" placeholder="UID do procurador" />
            </div>
          </div>

          <div>
            <label style="display:block;font-weight:700;font-size:12px;margin-bottom:6px;">URL do documento</label>
            <input id="proxyDocUrl" class="input" placeholder="https://..." />
          </div>

          <div>
            <label style="display:block;font-weight:700;font-size:12px;margin-bottom:6px;">Observação</label>
            <input id="proxyNote" class="input" placeholder="Opcional" />
          </div>

          <div style="display:flex;gap:10px;flex-wrap:wrap;">
            <button class="btn" type="button" id="saveProxyBtn">Salvar procuração</button>
            <button class="btn btn--ghost" type="button" id="deleteProxyBtn">Excluir procuração</button>
          </div>
        </article>

        <article class="card">
          <h2 class="card__title" style="margin-bottom: 10px;">Assinaturas</h2>
          <div id="signaturesList" style="display:grid;gap:8px;"></div>
        </article>
      </section>
    </main>

    <script src="/js/a2hs.js" defer></script>

    <script type="module">
      import { protect } from '/js/route-guard.js';
      import { logoutUser } from '/js/auth.js';
      import { watchAuthAndContext, getActiveContext, openSelector } from '/js/active-context.js';
      import {
        listAssembliesForCondo,
        searchAssembliesForCondo,
        createAssembly,
        updateAssembly,
        deleteAssembly,
        callAssembly,
        openVoting,
        closeVoting,
        generateMinutesText,
        saveMinutes,
        getLatestMinutes,
        listMinutesHistory,
        getQuorumSummary,
        upsertProxy,
        deleteProxy,
        listProxies,
        listSignatures,
      } from '/js/modules/assemblies.js';

      await protect(['/admin/'], ['GESTOR', 'SINDICO', 'ADMINISTRADORA', 'CARTEIRA', 'ADMIN']);

      const $ = (id) => document.getElementById(id);
      const statusEl = $('status');
      const ctxCondoName = $('ctxCondoName');

      const state = {
        condoId: '',
      };

      function setStatus(msg) {
        statusEl.textContent = msg ? String(msg) : '';
      }

      async function withBusy(btn, fn) {
        if (btn) btn.disabled = true;
        try {
          return await fn();
        } catch (e) {
          setStatus(e && e.message ? e.message : 'Erro');
          throw e;
        } finally {
          if (btn) btn.disabled = false;
        }
      }

      function currentCondoId() {
        return state.condoId ? String(state.condoId) : '';
      }

      function setActiveCondoName(text) {
        if (!ctxCondoName) return;
        ctxCondoName.textContent = text ? String(text) : '—';
      }

      function fmtDateMaybe(v) {
        try {
          if (!v) return '';
          if (typeof v.toDate === 'function') {
            const d = v.toDate();
            const yyyy = d.getFullYear();
            const mm = String(d.getMonth() + 1).padStart(2, '0');
            const dd = String(d.getDate()).padStart(2, '0');
            return yyyy + '-' + mm + '-' + dd;
          }
          return '';
        } catch (e) {
          return '';
        }
      }

      function renderList(container, items, onPick) {
        container.innerHTML = '';
        if (!items || items.length === 0) {
          container.innerHTML = '<p style="margin:0;color:var(--muted);font-size:12px;">Nenhum registro.</p>';
          return;
        }

        items.forEach((it) => {
          const row = document.createElement('div');
          row.className = 'card';
          row.style.padding = '12px';

          const head = document.createElement('div');
          head.style.display = 'flex';
          head.style.alignItems = 'center';
          head.style.justifyContent = 'space-between';
          head.style.gap = '10px';

          const left = document.createElement('div');
          const title = it.title || it.id;
          const date = it.date ? fmtDateMaybe(it.date) : '';
          const subtitle = [it.id, date ? ('data: ' + date) : null, it.status ? ('status: ' + it.status) : null, it.voteStatus ? ('voto: ' + it.voteStatus) : null]
            .filter(Boolean)
            .join(' • ');

          left.innerHTML = '<div style="font-weight:800;">' + title + '</div>' +
                           '<div style="font-size:12px;color:var(--muted);">' + subtitle + '</div>';

          const pickBtn = document.createElement('button');
          pickBtn.type = 'button';
          pickBtn.className = 'btn btn--ghost';
          pickBtn.textContent = 'Abrir';
          pickBtn.addEventListener('click', () => onPick(it));

          head.appendChild(left);
          head.appendChild(pickBtn);
          row.appendChild(head);
          container.appendChild(row);
        });
      }

      function renderTinyList(container, items, emptyText) {
        if (!container) return;
        container.innerHTML = '';
        if (!items || items.length === 0) {
          container.innerHTML = '<p style="margin:0;color:var(--muted);font-size:12px;">' + (emptyText || 'Nenhum registro.') + '</p>';
          return;
        }
        items.forEach((it) => {
          const row = document.createElement('div');
          row.className = 'card';
          row.style.padding = '10px';
          const title = it.title || it.id || '—';
          const subtitle = it.subtitle || '';
          row.innerHTML = '<div style="font-weight:800;">' + title + '</div>' +
                          (subtitle ? ('<div style="font-size:12px;color:var(--muted);margin-top:4px;">' + subtitle + '</div>') : '');
          container.appendChild(row);
        });
      }

      function clearForm() {
        $('assemblyId').value = '';
        $('assemblyTitle').value = '';
        $('assemblyDate').value = '';
        $('assemblyLocation').value = '';
        $('assemblyNotice').value = '';
        $('assemblyAgenda').value = '';
        $('voteMode').value = 'unit';
        $('quorumBox').textContent = '—';
        $('minutesText').value = '';
        $('minutesHistory').innerHTML = '';
        $('proxiesList').innerHTML = '';
        $('signaturesList').innerHTML = '';
      }

      async function refresh() {
        await refreshAssemblies({ preferSearch: true });
      }

      async function refreshAssemblies(opts) {
        const cId = currentCondoId();
        const listEl = $('assemblyList');
        if (!cId) {
          renderList(listEl, [], () => {});
          return;
        }

        opts = opts || {};
        const kw = $('searchKeyword') ? String($('searchKeyword').value || '').trim() : '';
        const shouldSearch = !!kw && opts.preferSearch !== false;

        const items = shouldSearch ? await searchAssembliesForCondo(cId, kw) : await listAssembliesForCondo(cId);
        renderList(listEl, items, async (it) => {
          $('assemblyId').value = it.id;
          $('assemblyTitle').value = it.title || '';
          $('assemblyDate').value = fmtDateMaybe(it.date);
          $('assemblyLocation').value = it.location || '';
          $('assemblyNotice').value = it.noticeText || '';
          $('assemblyAgenda').value = it.agendaText || '';
          $('voteMode').value = it.voteMode === 'user' ? 'user' : 'unit';

          const min = await getLatestMinutes(it.id);
          $('minutesText').value = min && min.text ? String(min.text) : '';

          try {
            const q = await getQuorumSummary(cId, it.id);
            $('quorumBox').textContent = `${q.presentUnits}/${q.totalUnits} unidades presentes (${q.presencePct}%) • ${q.votedUnits} votos`;
          } catch (e) {
            $('quorumBox').textContent = '—';
          }

          try {
            const hist = await listMinutesHistory(it.id);
            renderTinyList(
              $('minutesHistory'),
              hist.slice(0, 8).map((h) => ({
                id: h.id,
                title: `v${typeof h.version === 'number' ? h.version : '—'} • ${h.id}`,
                subtitle: h.hash ? ('hash: ' + String(h.hash).slice(0, 12) + '…') : '',
              })),
              'Sem versões no histórico.'
            );
          } catch (e) {
            renderTinyList($('minutesHistory'), [], 'Sem acesso ao histórico.');
          }

          try {
            const proxies = await listProxies(it.id);
            renderTinyList(
              $('proxiesList'),
              proxies.map((p) => ({
                id: p.id,
                title: `${p.unitId || p.id} → ${p.delegateUid || '—'}`,
                subtitle: p.docUrl ? String(p.docUrl) : (p.note ? String(p.note) : ''),
              })),
              'Nenhuma procuração.'
            );
          } catch (e) {
            renderTinyList($('proxiesList'), [], 'Sem acesso às procurações.');
          }

          try {
            const sigs = await listSignatures(it.id);
            renderTinyList(
              $('signaturesList'),
              sigs.slice(0, 20).map((s) => ({
                id: s.id,
                title: s.uid || s.id,
                subtitle: s.minutesHash ? ('hash: ' + String(s.minutesHash).slice(0, 12) + '…') : '',
              })),
              'Nenhuma assinatura.'
            );
          } catch (e) {
            renderTinyList($('signaturesList'), [], 'Sem acesso às assinaturas.');
          }

          setStatus('Assembleia selecionada: ' + it.id);
        });
      }

      async function refreshSelectedDetails() {
        const cId = currentCondoId();
        const aId = $('assemblyId').value ? String($('assemblyId').value) : '';
        if (!cId || !aId) return;
        try {
          const q = await getQuorumSummary(cId, aId);
          $('quorumBox').textContent = `${q.presentUnits}/${q.totalUnits} unidades presentes (${q.presencePct}%) • ${q.votedUnits} votos`;
        } catch (e) {}

        try {
          const hist = await listMinutesHistory(aId);
          renderTinyList(
            $('minutesHistory'),
            hist.slice(0, 8).map((h) => ({
              id: h.id,
              title: `v${typeof h.version === 'number' ? h.version : '—'} • ${h.id}`,
              subtitle: h.hash ? ('hash: ' + String(h.hash).slice(0, 12) + '…') : '',
            })),
            'Sem versões no histórico.'
          );
        } catch (e) {}

        try {
          const proxies = await listProxies(aId);
          renderTinyList(
            $('proxiesList'),
            proxies.map((p) => ({
              id: p.id,
              title: `${p.unitId || p.id} → ${p.delegateUid || '—'}`,
              subtitle: p.docUrl ? String(p.docUrl) : (p.note ? String(p.note) : ''),
            })),
            'Nenhuma procuração.'
          );
        } catch (e) {}

        try {
          const sigs = await listSignatures(aId);
          renderTinyList(
            $('signaturesList'),
            sigs.slice(0, 20).map((s) => ({
              id: s.id,
              title: s.uid || s.id,
              subtitle: s.minutesHash ? ('hash: ' + String(s.minutesHash).slice(0, 12) + '…') : '',
            })),
            'Nenhuma assinatura.'
          );
        } catch (e) {}
      }

      // Logout
      const logoutBtn = $('logoutBtn');
      logoutBtn.addEventListener('click', async () => {
        await withBusy(logoutBtn, async () => {
          await logoutUser();
          window.location.href = '/login.html';
        });
      });

      $('refreshBtn').addEventListener('click', async () => {
        await withBusy($('refreshBtn'), async () => {
          await refresh();
          setStatus('Atualizado.');
        });
      });

      if ($('searchBtn')) {
        $('searchBtn').addEventListener('click', async () => {
          await withBusy($('searchBtn'), async () => {
            await refreshAssemblies({ preferSearch: true });
            setStatus('Busca atualizada.');
          });
        });
      }

      if ($('clearSearchBtn')) {
        $('clearSearchBtn').addEventListener('click', async () => {
          if ($('searchKeyword')) $('searchKeyword').value = '';
          await withBusy($('clearSearchBtn'), async () => {
            await refreshAssemblies({ preferSearch: false });
            setStatus('Lista atualizada.');
          });
        });
      }

      const pickBtn = $('pickCtxBtn');
      if (pickBtn) pickBtn.addEventListener('click', () => openSelector());

      $('assemblyClearBtn').addEventListener('click', () => {
        clearForm();
        setStatus('');
      });

      $('assemblyDeleteBtn').addEventListener('click', async () => {
        const cId = currentCondoId();
        const aId = $('assemblyId').value;
        if (!cId || !aId) {
          if (!cId) openSelector();
          return;
        }
        if (!confirm('Excluir esta assembleia?')) return;
        await withBusy($('assemblyDeleteBtn'), async () => {
          await deleteAssembly(cId, aId);
          clearForm();
          await refreshAssemblies({ preferSearch: true });
          setStatus('Assembleia excluída.');
        });
      });

      $('assemblyForm').addEventListener('submit', async (e) => {
        e.preventDefault();

        const cId = currentCondoId();
        const aId = $('assemblyId').value;
        const title = $('assemblyTitle').value;
        const date = $('assemblyDate').value;
        const location = $('assemblyLocation').value;
        const noticeText = $('assemblyNotice').value;
        const agendaText = $('assemblyAgenda').value;
        const voteMode = $('voteMode').value;

        await withBusy($('assemblySaveBtn'), async () => {
          if (!cId) {
            openSelector();
            throw new Error('Selecione um condomínio.');
          }
          if (aId) {
            await updateAssembly(cId, aId, { title, date, location, noticeText, agendaText, voteMode });
            setStatus('Assembleia atualizada.');
          } else {
            const created = await createAssembly(cId, { title, date, location, noticeText, agendaText, voteMode });
            $('assemblyId').value = created.id;
            setStatus('Assembleia criada: ' + created.id);
          }
          await refreshAssemblies({ preferSearch: true });
          await refreshSelectedDetails();
        });
      });

      $('callBtn').addEventListener('click', async () => {
        const cId = currentCondoId();
        const aId = $('assemblyId').value;
        const noticeText = $('assemblyNotice').value;
        if (!cId || !aId) {
          if (!cId) openSelector();
          return;
        }
        await withBusy($('callBtn'), async () => {
          await callAssembly(cId, aId, noticeText);
          await refreshAssemblies({ preferSearch: true });
          setStatus('Convocação registrada.');
        });
      });

      $('openVoteBtn').addEventListener('click', async () => {
        const cId = currentCondoId();
        const aId = $('assemblyId').value;
        if (!cId || !aId) {
          if (!cId) openSelector();
          return;
        }
        await withBusy($('openVoteBtn'), async () => {
          await openVoting(cId, aId);
          await refreshAssemblies({ preferSearch: true });
          setStatus('Votação aberta.');
        });
      });

      $('closeVoteBtn').addEventListener('click', async () => {
        const cId = currentCondoId();
        const aId = $('assemblyId').value;
        if (!cId || !aId) {
          if (!cId) openSelector();
          return;
        }
        await withBusy($('closeVoteBtn'), async () => {
          await closeVoting(cId, aId);
          await refreshAssemblies({ preferSearch: true });
          setStatus('Votação fechada.');
        });
      });

      $('genMinutesBtn').addEventListener('click', async () => {
        const cId = currentCondoId();
        const aId = $('assemblyId').value;
        if (!cId || !aId) {
          if (!cId) openSelector();
          return;
        }
        await withBusy($('genMinutesBtn'), async () => {
          const text = await generateMinutesText(cId, aId);
          $('minutesText').value = text;
          setStatus('Texto gerado.');
        });
      });

      $('saveMinutesBtn').addEventListener('click', async () => {
        const cId = currentCondoId();
        const aId = $('assemblyId').value;
        const text = $('minutesText').value;
        if (!cId || !aId) {
          if (!cId) openSelector();
          return;
        }
        await withBusy($('saveMinutesBtn'), async () => {
          await saveMinutes(aId, cId, text);
          setStatus('Ata salva.');
          await refreshSelectedDetails();
        });
      });

      $('saveProxyBtn').addEventListener('click', async () => {
        const cId = currentCondoId();
        const aId = $('assemblyId').value;
        if (!cId || !aId) {
          if (!cId) openSelector();
          return;
        }
        await withBusy($('saveProxyBtn'), async () => {
          await upsertProxy(aId, cId, {
            unitId: $('proxyUnitId').value,
            delegateUid: $('proxyDelegateUid').value,
            docUrl: $('proxyDocUrl').value,
            note: $('proxyNote').value,
          });
          setStatus('Procuração salva.');
          await refreshSelectedDetails();
        });
      });

      $('deleteProxyBtn').addEventListener('click', async () => {
        const cId = currentCondoId();
        const aId = $('assemblyId').value;
        const uId = $('proxyUnitId').value;
        if (!cId || !aId) {
          if (!cId) openSelector();
          return;
        }
        await withBusy($('deleteProxyBtn'), async () => {
          await deleteProxy(aId, cId, uId);
          setStatus('Procuração excluída.');
          await refreshSelectedDetails();
        });
      });

      // Contexto vem do active-context.js
      watchAuthAndContext((ev) => {
        const ctx = ev && ev.context ? ev.context : getActiveContext();
        state.condoId = ctx && ctx.condoId ? String(ctx.condoId) : '';

        try {
          const condos = ev && Array.isArray(ev.condos) ? ev.condos : [];
          const picked = condos.find((c) => c && c.id === state.condoId);
          setActiveCondoName(picked && picked.name ? picked.name : (state.condoId || '—'));
        } catch (e) {
          setActiveCondoName(state.condoId || '—');
        }

        clearForm();
        refresh().catch(() => {});
      });

      const initial = getActiveContext();
      state.condoId = initial && initial.condoId ? String(initial.condoId) : '';
      setActiveCondoName(state.condoId || '—');
      await withBusy(null, refresh);
    </script>

    <script>
      (function () {
        try {
          if (!('serviceWorker' in navigator)) return;
          window.addEventListener('load', function () {
            navigator.serviceWorker.register('/sw.js').catch(function () {});
          });
        } catch (e) {}
      })();
    </script>
  </body>
</html>
